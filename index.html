<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HVACT</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0c0c0f;--surface:#13131a;--surface2:#1a1a24;--surface3:#22222f;
  --border:#2a2a3a;--border2:#333345;
  --amber:#f5a623;--amber2:#ffb84d;--amber-dim:#f5a62322;
  --green:#34d399;--green-dim:#34d39922;
  --red:#f87171;--red-dim:#f8717122;
  --blue:#60a5fa;--blue-dim:#60a5fa22;
  --cyan:#22d3ee;--cyan-dim:#22d3ee22;
  --purple:#a78bfa;--purple-dim:#a78bfa22;
  --orange:#fb923c;--orange-dim:#fb923c22;
  --text:#f0f0f5;--text2:#a0a0b8;--text3:#60607a;
  --radius:8px;--radius2:12px;--radius3:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
input,select,textarea,button{font-family:'DM Sans',sans-serif}
select option{background:var(--surface2)}
.mono{font-family:'Space Mono',monospace}

/* Base inputs */
.inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:0.55rem 0.75rem;font-size:0.875rem;outline:none;transition:border-color 0.15s}
.inp:focus{border-color:var(--amber)}
.inp::placeholder{color:var(--text3)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;min-height:80px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.5rem 1rem;border-radius:var(--radius);border:none;cursor:pointer;font-size:0.82rem;font-weight:600;transition:all 0.15s}
.btn-amber{background:var(--amber);color:#000}
.btn-amber:hover{background:var(--amber2)}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn-green{background:var(--green);color:#000}
.btn-red{background:transparent;border:1px solid var(--red-dim);color:var(--red)}
.btn-blue{background:var(--blue);color:#000}
.btn:disabled{opacity:0.4;cursor:not-allowed}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:1rem}
.card2{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:0.75rem}

/* Status colors */
.status-operational{color:var(--green)}
.status-needspm{color:var(--amber)}
.status-underrepair{color:var(--red)}
.status-outofservice{color:var(--text3)}
.status-readyforinstall{color:var(--blue)}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:0.7rem;font-weight:600}

/* Print styles */
@media print{
  .no-print{display:none!important}
  body{background:#fff;color:#000}
  .card,.card2{border:1px solid #ddd;break-inside:avoid}
}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.2s ease}

/* Nav */
.nav-item{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.75rem;border-radius:var(--radius);cursor:pointer;font-size:0.82rem;color:var(--text2);transition:all 0.15s;border:none;background:none;width:100%}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--amber-dim);color:var(--amber);font-weight:600}

/* Tab buttons */
.tab-btn{padding:0.4rem 0.75rem;border:none;background:none;color:var(--text3);cursor:pointer;font-size:0.75rem;font-weight:500;border-bottom:2px solid transparent;transition:all 0.15s;white-space:nowrap}
.tab-btn.active{color:var(--amber);border-bottom-color:var(--amber)}
.tab-btn:hover{color:var(--text)}

/* Stat card */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius2);padding:1rem;display:flex;flex-direction:column;gap:0.25rem}
.stat-val{font-size:1.75rem;font-weight:700;font-family:'Space Mono',monospace}
.stat-label{font-size:0.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em}

/* Unit list item */
.unit-item{padding:0.85rem 1rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;border-left:3px solid transparent}
.unit-item:hover{background:var(--surface2)}
.unit-item.selected{background:var(--surface2);border-left-color:var(--amber)}

/* Alerts */
.alert{border-radius:var(--radius);padding:0.75rem 1rem;margin-bottom:0.5rem;font-size:0.82rem}
.alert-critical{background:var(--red-dim);border:1px solid #f8717144;color:var(--red)}
.alert-warning{background:var(--orange-dim);border:1px solid #fb923c44;color:var(--orange)}
.alert-good{background:var(--green-dim);border:1px solid #34d39944;color:var(--green)}
.alert-info{background:var(--blue-dim);border:1px solid #60a5fa44;color:var(--blue)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px)}
.modal-box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius3);width:100%;max-width:660px;max-height:92vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,0.6)}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;border-radius:var(--radius3) var(--radius3) 0 0}
.modal-body{padding:1.25rem}

/* Health ring */
.health-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

// ─── Constants ────────────────────────────────────────────────────────────────
const SUPA_URL="https://xljwomzktagpacdubqdy.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsandvbXprdGFncGFjZHVicWR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MDEyMDYsImV4cCI6MjA5NDk3NzIwNn0._jUS2bZ119SYhzAr17m8t7tTLWW9mSqY3QhDlq9wujY";

const FLOORS=["North Lobby","South Lobby","3S","4S","5S","5","6S","6","7S","7","8S","8","9","10","11","12","13","14","15","Rooftop","Mechanical Room","Engineer Shop","Other"];

  {key:"relay",label:"Relay",cost:25,re:/\brelay\b/i},
  {key:"thermostat",label:"Thermostat",cost:150,re:/thermostat/i},
  {key:"contactor",label:"Contactor",cost:55,re:/contactor/i},
  {key:"filter",label:"Filter",cost:20,re:/\bfilter\b/i},
  {key:"coil",label:"Coil",cost:800,re:/\bcoil\b/i},

];

const SC={"Operational":"var(--green)","Needs PM":"var(--amber)","Under Repair":"var(--red)","Out of Service":"var(--text3)","Ready for Install":"var(--blue)"};
const PC={"Current":"var(--green)","Due Soon":"var(--amber)","Overdue":"var(--red)"};
const TC={PM:"var(--green)",Repair:"var(--red)",Inspection:"var(--blue)",Note:"var(--purple)",Emergency:"var(--orange)",Refrigerant:"var(--cyan)"};

// ─── Auth helpers ─────────────────────────────────────────────────────────────
async function authSignUp(email,password,name,role){
  const r=await fetch("/supabase/auth/v1/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password,data:{name,role}})});
  const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||"Signup failed");return d;
}
async function authSignIn(email,password){
  const r=await fetch("/supabase/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||"Login failed");return d;
}
async function authSignOut(token){await fetch("/supabase/auth/v1/logout",{method:"POST",headers:{"Authorization":"Bearer "+token}});}
async function authGetUser(token){const r=await fetch("/supabase/auth/v1/user",{headers:{"Authorization":"Bearer "+token}});return r.ok?r.json():null;}
function getSession(){try{return JSON.parse(localStorage.getItem("hvac_sess")||"null")}catch(e){return null}}
function saveSession(s){try{localStorage.setItem("hvac_sess",JSON.stringify(s))}catch(e){}}
function clearSess(){try{localStorage.removeItem("hvac_sess")}catch(e){}}
async function refreshSession(rt){
  const r=await fetch("/supabase/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refresh_token:rt})});
  const d=await r.json();if(!r.ok)throw new Error("Refresh failed");saveSession(d);return d;
}
async function getValidToken(){
  let s=getSession();if(!s)return null;
  const exp=s.expires_at||0,now=Math.floor(Date.now()/1000);
  if(exp-now<300&&s.refresh_token){try{s=await refreshSession(s.refresh_token)}catch(e){clearSess();return null}}
  return s.access_token||null;
}

// ─── DB helpers ───────────────────────────────────────────────────────────────
function hdrs(token){return{"Content-Type":"application/json","Authorization":"Bearer "+(token||""),"Accept":"application/json","X-User-Token":token||""}}
function toRow(unit){
  return{id:unit.id,serial_number:unit.serialNumber,make:unit.make,model:unit.model,floor:unit.floor,location:unit.location,status:unit.status,pm_status:unit.pmStatus,last_pm:unit.lastPM,next_pm:unit.nextPM,install_date:unit.installDate,notes:unit.notes,photo_base64:unit.photoBase64||null,diagram_base64:unit.diagramBase64||null,created_at:unit.createdAt,logs:unit.logs||[],specs:JSON.stringify({zone:unit.zone||"",volts:unit.volts,hz:unit.hz,compRLA:unit.compRLA,lra:unit.lra,evapFanAmps:unit.evapFanAmps,refrigerantType:unit.refrigerantType,totalCharge:unit.totalCharge,highSidePSI:unit.highSidePSI,lowSidePSI:unit.lowSidePSI})};
}
async function dbGet(token){
  token=await getValidToken()||token;
  const r=await fetch("/supabase/rest/v1/units?order=created_at.asc",{headers:hdrs(token)});
  if(!r.ok)throw new Error(await r.text());
  return(await r.json()).map(row=>{
    let sp={};try{sp=JSON.parse(row.specs||"{}")}catch(e){}
    return{id:row.id,serialNumber:row.serial_number,make:row.make,model:row.model,floor:row.floor,location:row.location,status:row.status,pmStatus:row.pm_status,lastPM:row.last_pm,nextPM:row.next_pm,installDate:row.install_date,notes:row.notes,photoBase64:row.photo_base64||"",diagramBase64:row.diagram_base64||"",createdAt:row.created_at,logs:row.logs||[],zone:sp.zone||"",volts:sp.volts||"",hz:sp.hz||"",compRLA:sp.compRLA||"",lra:sp.lra||"",evapFanAmps:sp.evapFanAmps||"",refrigerantType:sp.refrigerantType||"",totalCharge:sp.totalCharge||"",highSidePSI:sp.highSidePSI||"",lowSidePSI:sp.lowSidePSI||""};
  });
}
async function dbSave(token,unit){
  token=await getValidToken()||token;
  const r=await fetch("/supabase/rest/v1/units",{method:"POST",headers:Object.assign({},hdrs(token),{"Prefer":"resolution=merge-duplicates,return=representation"}),body:JSON.stringify(toRow(unit))});
  if(!r.ok)throw new Error(await r.text());
  return r.json().catch(()=>null);
}
async function dbUpdate(token,unit){
  token=await getValidToken()||token;
  const row=toRow(unit);delete row.id;delete row.created_at;
  const r=await fetch("/supabase/rest/v1/units?id=eq."+unit.id,{method:"PATCH",headers:Object.assign({},hdrs(token),{"Prefer":"return=representation"}),body:JSON.stringify(row)});
  if(!r.ok)throw new Error(await r.text());
  return r.json().catch(()=>null);
}
async function dbDelete(token,id){
  token=await getValidToken()||token;

  if(!r.ok)throw new Error(await r.text());
}

// ─── Utils ────────────────────────────────────────────────────────────────────
function addMonths(ds,n){const d=new Date(ds);d.setMonth(d.getMonth()+n);return d.toISOString().split("T")[0]}
function fmtDate(ds){if(!ds)return"--";return new Date(ds).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"})}
function localDate(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function getSavedBrands(){try{return JSON.parse(localStorage.getItem("hvac_brands")||"{}")}catch(e){return{}}}
function saveBrand(make,model){const b=getSavedBrands();if(!b[make])b[make]=[];if(model&&!b[make].includes(model))b[make].push(model);try{localStorage.setItem("hvac_brands",JSON.stringify(b))}catch(e){}}
function getAllMakes(){return Object.keys(getSavedBrands()).sort()}
function getModels(make){return(getSavedBrands()[make]||[]).sort()}
function countParts(logs){const c={};PARTS.forEach(p=>{c[p.key]=logs.filter(l=>l.type!=="PM"&&p.re.test(l.description)).length});return c}
function compressImage(file,maxW){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1,maxW/img.width),c=document.createElement("canvas");
      c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.8).split(",")[1]);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url;
  });
}

// ─── Analysis ─────────────────────────────────────────────────────────────────
function calcHealth(unit){
  let s=100;const logs=unit.logs||[];
  if(unit.installDate){const age=(new Date()-new Date(unit.installDate))/(365.25*86400000);s-=Math.min(40,age*2.5)}
  s-=logs.filter(l=>l.type==="Repair"||l.type==="Emergency").length*5;
  s-=logs.filter(l=>l.type==="Refrigerant"||/leak|refrigerant|freon/i.test(l.description)).length*8;
  if(unit.nextPM){const over=Math.round((new Date()-new Date(unit.nextPM))/86400000);if(over>60)s-=15;else if(over>30)s-=8}
  const pms=logs.filter(l=>l.type==="PM");if(pms.length>=2)s+=5;
  const pc=countParts(logs);
  if(pc.compressor>0)s-=10;if(pc.reversingValve>0)s-=8;
  return Math.max(0,Math.min(100,Math.round(s)));
}
function calcLife(unit){
  if(!unit.installDate)return null;
  const age=(new Date()-new Date(unit.installDate))/(365.25*86400000);
  const repairs=((unit.logs||[]).filter(l=>l.type==="Repair"||l.type==="Emergency")).length;
  const adj=15-repairs*0.5,rem=Math.max(0,adj-age);
  return{age:age.toFixed(1),rem:rem.toFixed(1),eol:new Date().getFullYear()+Math.round(rem)};
}
function calcCosts(unit){
  const pc=countParts(unit.logs||[]);
  let parts=0;PARTS.forEach(p=>{parts+=pc[p.key]*p.cost});
  const labor=(unit.logs||[]).filter(l=>l.type==="Repair"||l.type==="Emergency").length*2*85;
  return{parts,labor,total:parts+labor};
}
function analyze(unit){
  const logs=unit.logs||[],alerts=[];
  const repairs=logs.filter(l=>l.type==="Repair");
  const refLogs=logs.filter(l=>l.type==="Refrigerant"||/leak|low pressure|refrigerant|freon|charge/i.test(l.description));
  if(refLogs.length>=2)alerts.push({level:"critical",icon:"🔴",title:"RECURRING REFRIGERANT LEAK ("+refLogs.length+"x)",detail:"Repeated recharging indicates an active leak.",actions:["Stop recharging — find and fix the leak.","Pull unit, pressure test.","Coil/compressor leak: REPLACE UNIT.","Document all refrigerant additions (EPA 608)."]});
  else if(refLogs.length===1)alerts.push({level:"warning",icon:"🟡",title:"REFRIGERANT EVENT LOGGED",detail:"One event. Monitor — second confirms a leak.",actions:["Check fittings for oil residue.","Use leak detector at next PM."]});
  if(repairs.length>=3){
    const sorted=[...repairs].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const span=Math.round((new Date(sorted[sorted.length-1].date)-new Date(sorted[0].date))/86400000);
    const pyr=span>0?(repairs.length/(span/365)).toFixed(1):repairs.length;
    alerts.push({level:repairs.length>=5?"critical":"warning",icon:repairs.length>=5?"🔴":"🟡",title:"HIGH REPAIR FREQUENCY ("+repairs.length+" repairs, ~"+pyr+"/yr)",detail:"Units averaging 2+ repairs/year are not cost-effective.",actions:["Compare repair costs vs new unit.","Budget for replacement if 5+ repairs."]});
  }
  const compLogs=logs.filter(l=>/compressor/i.test(l.description));
  if(compLogs.length>=2)alerts.push({level:"critical",icon:"🔴",title:"RECURRING COMPRESSOR ISSUES ("+compLogs.length+"x)",detail:"Compressor repairs cost 50-70% of new unit.",actions:["RECOMMEND UNIT REPLACEMENT.","Check electrical supply voltage.","Verify refrigerant charge."]});
  const elecLogs=logs.filter(l=>/capacitor|contactor|electrical|fuse|breaker|relay/i.test(l.description));
  if(elecLogs.length>=2)alerts.push({level:"warning",icon:"🟡",title:"RECURRING ELECTRICAL ISSUES ("+elecLogs.length+"x)",detail:"Multiple electrical component failures.",actions:["Check voltage within 10% of nameplate.","Replace capacitors/contactors at next PM."]});
  if(unit.nextPM){const over=Math.round((new Date(localDate())-new Date(unit.nextPM))/86400000);if(over>30)alerts.push({level:"warning",icon:"🟡",title:"PM OVERDUE BY "+over+" DAYS",detail:"Deferred PMs increase failure risk.",actions:["Schedule PM immediately."]})}
  if(alerts.length===0&&logs.length>=2)alerts.push({level:"good",icon:"✅",title:"NO RECURRING ISSUES DETECTED",detail:logs.length+" entries analyzed. Unit appears normal.",actions:["Continue PM every 4 months.","Monitor refrigerant pressure at each PM."]});
  return alerts;
}

// ─── Shared UI components ─────────────────────────────────────────────────────
function Modal({title,onClose,children,wide}){
  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className="modal-box fade-in" style={{maxWidth:wide?"800px":"660px"}}>
      <div className="modal-header">
        <span style={{fontWeight:600,color:"var(--amber)",fontSize:"0.9rem"}}>{title}</span>
        <button className="btn btn-ghost" style={{padding:"0.25rem 0.6rem",fontSize:"1rem"}} onClick={onClose}>✕</button>
      </div>
      <div className="modal-body">{children}</div>
    </div>
  </div>;
}
function Field({label,children,half}){
  return <div style={{marginBottom:"0.85rem"}}>
    <label style={{display:"block",fontSize:"0.7rem",color:"var(--text3)",letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:"0.3rem",fontWeight:500}}>{label}</label>
    {children}
  </div>;
}
function Section({title,children,color}){
  return <div style={{marginBottom:"1.25rem"}}>
    <div style={{fontSize:"0.65rem",color:color||"var(--amber)",letterSpacing:"0.12em",textTransform:"uppercase",fontWeight:700,marginBottom:"0.75rem",fontFamily:"Space Mono,monospace"}}>{title}</div>
    {children}
  </div>;
}
function StatusBadge({status}){
  const colors={"Operational":"green","Needs PM":"amber","Under Repair":"red","Out of Service":"text3","Ready for Install":"blue"};
  const c=colors[status]||"text3";
  return <span className="badge" style={{background:"var(--"+c+"-dim,var(--surface2))",color:"var(--"+c+")"}}>
    {status}

function HealthRing({score,size}){
  const s=size||64;const r=s/2-5;const circ=2*Math.PI*r;
  const color=score>=75?"var(--green)":score>=50?"var(--amber)":score>=25?"var(--orange)":"var(--red)";
  const label=score>=75?"GOOD":score>=50?"FAIR":score>=25?"POOR":"CRITICAL";
  return <div style={{display:"flex",alignItems:"center",gap:"0.75rem"}}>
    <div style={{position:"relative",width:s+"px",height:s+"px",flexShrink:0}}>
      <svg width={s} height={s} style={{transform:"rotate(-90deg)"}}>
        <circle cx={s/2} cy={s/2} r={r} fill="none" stroke="var(--surface3)" strokeWidth="4"/>
        <circle cx={s/2} cy={s/2} r={r} fill="none" stroke={color} strokeWidth="4"
          strokeDasharray={circ} strokeDashoffset={circ*(1-score/100)} strokeLinecap="round"/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Space Mono,monospace",fontSize:s>48?"0.8rem":"0.65rem",fontWeight:700,color}}>{score}</div>
    </div>

      <div style={{fontWeight:700,color,fontSize:"0.9rem"}}>{label}</div>
      <div style={{fontSize:"0.65rem",color:"var(--text3)",marginTop:"2px"}}>HEALTH SCORE</div>
    </div>
  </div>;
}

function AuthScreen({onLogin}){
  const [mode,setMode]=useState("login");

  const [password,setPassword]=useState("");
  const [name,setName]=useState("");
  const [role,setRole]=useState("technician");

  const [error,setError]=useState("");
  const [success,setSuccess]=useState("");
  function handle(){
    setError("");setSuccess("");setLoading(true);
    if(mode==="login"){
      authSignIn(email,password).then(s=>{saveSession(s);onLogin(s)}).catch(e=>{setError(e.message);setLoading(false)});
    }else{
      authSignUp(email,password,name,role).then(()=>{setSuccess("Account created! You can now log in.");setMode("login");setLoading(false)}).catch(e=>{setError(e.message);setLoading(false)});

// ─── Field Tools ──────────────────────────────────────────────────────────────
function PTChartTool(){
  const PT={
    "R-22":{low:[[-40,-73],[-20,-29],[0,10],[20,57],[40,117],[60,196],[80,304],[100,444],[120,627]],high:[[-40,-73],[-20,-29],[0,10],[20,57],[40,117],[60,196],[80,304],[100,444],[120,627]]},
    "R-410A":{low:[[-40,-6],[-20,33],[0,83],[20,150],[40,239],[60,355],[80,509],[100,706],[120,957]],high:[[-40,-6],[-20,33],[0,83],[20,150],[40,239],[60,355],[80,509],[100,706],[120,957]]},
    "R-134a":{low:[[-40,-13],[-20,7],[0,29],[20,57],[40,95],[60,145],[80,213],[100,299],[120,405]],high:[]},
    "R-32":{low:[[-40,-2],[-20,46],[0,112],[20,203],[40,327],[60,493],[80,712],[100,993],[120,1345]],high:[]},
  };
  const [ref,setRef]=useState("R-410A");
  const [pressure,setPressure]=useState("");
  const [result,setResult]=useState(null);
  function lookup(){
    const p=parseFloat(pressure);if(isNaN(p))return;
    const data=PT[ref]?.low||[];
    for(let i=0;i<data.length-1;i++){
      if(p>=data[i][1]&&p<=data[i+1][1]){
        const ratio=(p-data[i][1])/(data[i+1][1]-data[i][1]);
        const temp=data[i][0]+ratio*(data[i+1][0]-data[i][0]);
        setResult({temp:temp.toFixed(1),ref,pressure:p});return;
      }
    }
    setResult(null);
  }
  return <div>
    <Section title="PT Chart — Pressure / Temperature">
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
        <Field label="Refrigerant"><select className="inp" value={ref} onChange={e=>{setRef(e.target.value);setResult(null)}}>{Object.keys(PT).map(k=><option key={k}>{k}</option>)}</select></Field>
        <Field label="Pressure (PSI)"><input className="inp" type="number" value={pressure} onChange={e=>setPressure(e.target.value)} placeholder="e.g. 150"/></Field>
      </div>
      <button className="btn btn-amber" onClick={lookup} style={{width:"100%",justifyContent:"center",marginBottom:"0.75rem"}}>Look Up Temperature</button>
      {result&&<div className="card2" style={{textAlign:"center",background:"var(--amber-dim)",border:"1px solid var(--amber)"}}>
        <div style={{fontSize:"2rem",fontWeight:700,color:"var(--amber)",fontFamily:"Space Mono,monospace"}}>{result.temp}°F</div>
        <div style={{fontSize:"0.72rem",color:"var(--text3)",marginTop:"4px"}}>Saturation temperature at {result.pressure} PSI for {result.ref}</div>
      </div>}
    </Section>
    <Section title="Quick Reference Table" color="var(--blue)">
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:"0.78rem"}}>
          <thead><tr>{["Temp °F","R-22","R-410A","R-134a","R-32"].map(h=><th key={h} style={{padding:"0.5rem",textAlign:"left",borderBottom:"1px solid var(--border)",color:"var(--text3)",fontWeight:600}}>{h}</th>)}</tr></thead>
          <tbody>
            {[[-20,-29,33,7,46],[0,10,83,29,112],[20,57,150,57,203],[40,117,239,95,327],[60,196,355,145,493],[80,304,509,213,712],[100,444,706,299,993]].map((row,i)=><tr key={i} style={{background:i%2===0?"transparent":"var(--surface2)"}}>
              {row.map((v,j)=><td key={j} style={{padding:"0.45rem 0.5rem",borderBottom:"1px solid var(--border)"}}>{v}{j===0?"°F":" PSI"}</td>)}
            </tr>)}
          </tbody>
        </table>
      </div>
    </Section>
  </div>;
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({units}){
  const total=units.length;
  const byStatus=UNIT_STATUS.reduce((a,s)=>{a[s]=units.filter(u=>u.status===s).length;return a},{});
  const pmCompliance=total>0?Math.round(units.filter(u=>u.pmStatus==="Current").length/total*100):0;
  const critUnits=units.filter(u=>analyze(u).some(a=>a.level==="critical"));
  const avgHealth=total>0?Math.round(units.reduce((s,u)=>s+calcHealth(u),0)/total):0;
  const floorData=FLOORS.map(f=>{
    const fu=units.filter(u=>u.floor===f);
    if(!fu.length)return null;
    return{floor:f,count:fu.length,health:Math.round(fu.reduce((s,u)=>s+calcHealth(u),0)/fu.length)};
  }).filter(Boolean);
  const topRepairs=[...units].sort((a,b)=>(b.logs||[]).filter(l=>l.type==="Repair").length-(a.logs||[]).filter(l=>l.type==="Repair").length).slice(0,5);
  return <div className="fade-in">
    <div style={{marginBottom:"1.5rem"}}>
      <h2 style={{fontSize:"1.1rem",fontWeight:700,marginBottom:"0.25rem"}}>Building Dashboard</h2>
      <p style={{color:"var(--text3)",fontSize:"0.82rem"}}>Real-time health overview of all {total} units</p>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:"0.75rem",marginBottom:"1.5rem"}}>
      {[
        {label:"Total Units",val:total,color:"var(--text)"},
        {label:"Operational",val:byStatus["Operational"]||0,color:"var(--green)"},
        {label:"Needs PM",val:byStatus["Needs PM"]||0,color:"var(--amber)"},
        {label:"Under Repair",val:byStatus["Under Repair"]||0,color:"var(--red)"},
        {label:"PM Compliance",val:pmCompliance+"%",color:pmCompliance>=80?"var(--green)":pmCompliance>=60?"var(--amber)":"var(--red)"},
        {label:"Avg Health",val:avgHealth,color:avgHealth>=75?"var(--green)":avgHealth>=50?"var(--amber)":"var(--red)"},
      ].map(s=><div key={s.label} className="stat-card">
        <div className="stat-val" style={{color:s.color}}>{s.val}</div>
        <div className="stat-label">{s.label}</div>
      </div>)}
    </div>
    {critUnits.length>0&&<div style={{marginBottom:"1.5rem"}}>
      <div style={{fontSize:"0.72rem",color:"var(--red)",letterSpacing:"0.1em",marginBottom:"0.75rem",fontWeight:700}}>⚠️ CRITICAL UNITS — NEED ATTENTION</div>
      {critUnits.slice(0,5).map(u=><div key={u.id} className="card2" style={{marginBottom:"0.5rem",borderColor:"var(--red-dim)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <span style={{fontFamily:"Space Mono,monospace",color:"var(--amber)",fontWeight:700,fontSize:"0.85rem"}}>{u.serialNumber}</span>
            <span style={{color:"var(--text3)",fontSize:"0.75rem",marginLeft:"0.5rem"}}>{u.make} {u.model} — {u.floor}</span>
          </div>
          <HealthRing score={calcHealth(u)} size={44}/>
        </div>
      </div>)}
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1rem"}}>
      <div>
        <div style={{fontSize:"0.72rem",color:"var(--blue)",letterSpacing:"0.1em",marginBottom:"0.75rem",fontWeight:700}}>FLOOR HEALTH SCORES</div>
        {floorData.map(f=><div key={f.floor} style={{display:"flex",alignItems:"center",gap:"0.75rem",marginBottom:"0.5rem"}}>
          <div style={{fontSize:"0.75rem",color:"var(--text2)",width:"100px",flexShrink:0}}>{f.floor}</div>
          <div style={{flex:1,height:"6px",background:"var(--surface3)",borderRadius:"99px",overflow:"hidden"}}>
            <div style={{height:"100%",width:f.health+"%",background:f.health>=75?"var(--green)":f.health>=50?"var(--amber)":"var(--red)",borderRadius:"99px",transition:"width 0.5s"}}/>
          </div>
          <div style={{fontSize:"0.72rem",fontFamily:"Space Mono,monospace",color:f.health>=75?"var(--green)":f.health>=50?"var(--amber)":"var(--red)",width:"30px",textAlign:"right"}}>{f.health}</div>
        </div>)}
      </div>
      <div>
        <div style={{fontSize:"0.72rem",color:"var(--orange)",letterSpacing:"0.1em",marginBottom:"0.75rem",fontWeight:700}}>MOST REPAIRED UNITS</div>
        {topRepairs.map((u,i)=>{
          const rc=(u.logs||[]).filter(l=>l.type==="Repair").length;
          return rc>0?<div key={u.id} style={{display:"flex",alignItems:"center",gap:"0.5rem",marginBottom:"0.5rem",fontSize:"0.78rem"}}>
            <span style={{color:"var(--text3)",width:"16px"}}>{i+1}.</span>
            <span style={{color:"var(--text2)",flex:1}}>{u.serialNumber}</span>
            <span style={{color:"var(--orange)",fontWeight:700,fontFamily:"Space Mono,monospace"}}>{rc}x</span>
          </div>:null;
        })}
      </div>
    </div>
  </div>;
}

      {(!unit.logs||!unit.logs.length)?<div style={{color:"var(--text3)",textAlign:"center",padding:"2.5rem 0",fontSize:"0.85rem"}}>No service history yet</div>
      :[...unit.logs].reverse().map((log,i)=><div key={i} style={{borderLeft:"3px solid "+(TC[log.type]||"var(--border)"),paddingLeft:"0.85rem",marginBottom:"1rem"}}>
        <div style={{display:"flex",gap:"0.5rem",alignItems:"center",flexWrap:"wrap",marginBottom:"0.3rem"}}>
          <span style={{background:(TC[log.type]||"var(--border)")+"22",color:TC[log.type]||"var(--text3)",fontSize:"0.68rem",fontWeight:700,padding:"2px 8px",borderRadius:"99px"}}>{log.type}</span>
          <span style={{color:"var(--text3)",fontSize:"0.72rem"}}>{fmtDate(log.date)}</span>
          {log.tech&&<span style={{background:"var(--amber-dim)",color:"var(--amber)",fontSize:"0.68rem",fontWeight:700,padding:"2px 8px",borderRadius:"99px"}}>{log.tech}</span>}
          {log.refrigerantAdded&&<span style={{color:"var(--cyan)",fontSize:"0.68rem"}}>💧 {log.refrigerantAdded} lbs</span>}
          {log.pressure&&<span style={{color:"var(--purple)",fontSize:"0.68rem"}}>⚡ {log.pressure} PSI</span>}
          {isAdmin&&<button onClick={()=>onDeleteLog(unit.logs.length-1-i)} style={{marginLeft:"auto",background:"none",border:"none",color:"var(--text3)",cursor:"pointer",fontSize:"0.7rem",padding:0}}>✕</button>}
        </div>
        <div style={{color:"var(--text2)",fontSize:"0.82rem",lineHeight:1.6}}>{log.description}</div>
      </div>)}
    </div>
  </div>;
}

function PartsTab({unit}){
  const counts=countParts(unit.logs||[]);
  return <div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.5rem"}}>
      {PARTS.map(p=>{
        const c=counts[p.key];
        const color=c>=3?"var(--red)":c>=2?"var(--amber)":c>=1?"var(--green)":"var(--text3)";
        return <div key={p.key} className="card2" style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderColor:c>0?color+"44":"var(--border)"}}>
          <span style={{fontSize:"0.78rem",color:c>0?"var(--text2)":"var(--text3)"}}>{p.label}</span>
          <span style={{fontFamily:"Space Mono,monospace",fontWeight:700,color:c>0?color:"var(--text3)"}}>{c}</span>
        </div>;
      })}
    </div>
    <div style={{marginTop:"0.75rem",fontSize:"0.7rem",color:"var(--text3)"}}>🟢 1 = normal &nbsp; 🟡 2 = monitor &nbsp; 🔴 3+ = critical</div>
  </div>;
}

function AnalysisTab({unit}){
  const patterns=analyze(unit);
  if(!unit.logs||unit.logs.length<2) return <div style={{color:"var(--text3)",textAlign:"center",padding:"2rem",fontSize:"0.85rem"}}>Add at least 2 log entries to enable analysis.</div>;
  return <div>{patterns.map((a,i)=><div key={i} className={a.level==="critical"?"alert alert-critical":a.level==="warning"?"alert alert-warning":a.level==="good"?"alert alert-good":"alert alert-info"} style={{marginBottom:"0.75rem"}}>
    <div style={{fontWeight:700,marginBottom:"0.35rem",fontSize:"0.85rem"}}>{a.icon} {a.title}</div>
    <div style={{marginBottom:"0.5rem",opacity:0.9}}>{a.detail}</div>
    <div style={{fontSize:"0.72rem",opacity:0.8}}>{a.actions.map((x,j)=><div key={j} style={{marginTop:"2px"}}>→ {x}</div>)}</div>
  </div>)}</div>;
}

function TroubleshootTab({unit}){
  const [symptom,setSymptom]=useState("");
  const [result,setResult]=useState("");
  const [loading,setLoading]=useState(false);
  function run(){
    if(!symptom.trim())return;
    setLoading(true);setResult("");
    const counts=countParts(unit.logs||[]);
    const partsHist=PARTS.filter(p=>counts[p.key]>0).map(p=>p.label+": "+counts[p.key]+"x").join(", ")||"None";
    const hist=(unit.logs||[]).slice(-6).map(l=>"["+l.type+"] "+l.date+": "+l.description).join("\n")||"No history";
    const specs=[unit.volts&&"Volts:"+unit.volts,unit.refrigerantType&&"Ref:"+unit.refrigerantType,unit.totalCharge&&"Charge:"+unit.totalCharge+"Ozs",unit.compRLA&&"RLA:"+unit.compRLA+"A",unit.highSidePSI&&"High:"+unit.highSidePSI+"PSI",unit.lowSidePSI&&"Low:"+unit.lowSidePSI+"PSI"].filter(Boolean).join(", ")||"not recorded";
    const prompt="You are a senior HVAC technician.\n\nUNIT: "+unit.make+" "+unit.model+", S/N: "+unit.serialNumber+", Floor: "+unit.floor+" "+(unit.zone||"")+" "+(unit.location||"")+"\nSPECS: "+specs+"\nPARTS HISTORY: "+partsHist+"\nSERVICE HISTORY:\n"+hist+"\nSYMPTOM: "+symptom+"\n\n"+(unit.diagramBase64?"Wiring diagram attached.":"No diagram.")+"\n\nProvide: 1.MOST LIKELY CAUSES 2.STEP-BY-STEP DIAGNOSTIC 3.TOOLS NEEDED 4.PARTS TO REPLACE 5.SAFETY WARNINGS 6.ESTIMATED TIME & COST";
    const content=unit.diagramBase64?[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:unit.diagramBase64}},{type:"text",text:prompt}]:[{type:"text",text:prompt}];
    fetch("/anthropic",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1800,messages:[{role:"user",content}]})})
      .then(r=>r.json()).then(d=>{setResult((d.content||[]).map(b=>b.text||"").join("").trim());setLoading(false)})
      .catch(e=>{setResult("Error: "+e.message);setLoading(false)});
  }
  return <div>
    <div className="card2" style={{marginBottom:"0.85rem",borderColor:unit.diagramBase64?"var(--green-dim)":"var(--amber-dim)"}}>
      <div style={{fontSize:"0.78rem",fontWeight:600,color:unit.diagramBase64?"var(--green)":"var(--amber)"}}>
        {unit.diagramBase64?"📐 Wiring diagram loaded":"⚠️ No diagram — edit unit to upload one"}
      </div>
    </div>
    <Field label="Describe the Problem">
      <textarea className="inp" style={{minHeight:"90px"}} value={symptom} onChange={e=>setSymptom(e.target.value)} placeholder="e.g. Not cooling, compressor loud, tripping breaker, freezing up..."/>
    </Field>
    <button className="btn btn-blue" style={{width:"100%",justifyContent:"center",marginBottom:"1rem"}} disabled={loading||!symptom.trim()} onClick={run}>
      {loading?"🔍 Analyzing...":"🤖 Run AI Troubleshoot"}
    </button>
    {result&&<div className="card2" style={{borderColor:"var(--blue-dim)"}}>
      <div style={{fontSize:"0.65rem",color:"var(--blue)",letterSpacing:"0.1em",marginBottom:"0.75rem",fontWeight:700}}>AI TROUBLESHOOTING REPORT</div>
      <div style={{fontSize:"0.82rem",color:"var(--text2)",lineHeight:1.75,whiteSpace:"pre-wrap"}}>{result}</div>
    </div>}
  </div>;
}

function ManualsTab({unit}){
  const [sel,setSel]=useState(null);
  const [q,setQ]=useState("");
  const [result,setResult]=useState("");
  const [loading,setLoading]=useState(false);
  function ask(){
    if(!q.trim()||!sel)return;
    setLoading(true);setResult("");
    const prompt="You are a senior HVAC technician. Unit: "+unit.make+" "+unit.model+", S/N: "+unit.serialNumber+"\n\nUsing the manual \""+sel.name+"\" ("+sel.brand+"), answer:\n\n"+q+"\n\nBe specific, reference section names, give step-by-step guidance.";
    fetch("/anthropic",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:prompt}]})})
    .then(r=>r.json()).then(d=>{setResult((d.content||[]).map(b=>b.text||"").join("").trim());setLoading(false)})
    .catch(e=>{setResult("Error: "+e.message);setLoading(false)});
  }
  return <div>
    {MANUALS.map((m,i)=><div key={i} onClick={()=>{setSel(m);setResult("")}} className="card2" style={{marginBottom:"0.5rem",cursor:"pointer",borderColor:sel?.url===m.url?"var(--amber)":"var(--border)",background:sel?.url===m.url?"var(--amber-dim)":"var(--surface2)"}}>
      <div style={{display:"flex",alignItems:"center",gap:"0.75rem"}}>
        <span style={{fontSize:"1.2rem"}}>📄</span>
        <div style={{flex:1}}>
          <div style={{fontSize:"0.82rem",fontWeight:600,color:sel?.url===m.url?"var(--amber)":"var(--text)"}}>{m.name}</div>
          <div style={{fontSize:"0.68rem",color:"var(--text3)"}}>{m.brand}</div>
        </div>
        <a href={m.url} target="_blank" onClick={e=>e.stopPropagation()} className="btn btn-ghost" style={{padding:"0.25rem 0.6rem",fontSize:"0.68rem"}}>VIEW PDF</a>
      </div>
    </div>)}
    {sel&&<div style={{marginTop:"1rem"}}>
      <div style={{fontSize:"0.65rem",color:"var(--amber)",letterSpacing:"0.1em",marginBottom:"0.5rem",fontWeight:700}}>ASK AI ABOUT: {sel.name}</div>
      <textarea className="inp" style={{marginBottom:"0.5rem"}} value={q} onChange={e=>setQ(e.target.value)} placeholder="e.g. What is the startup procedure? Maintenance intervals? How to check refrigerant charge?"/>
      <button className="btn btn-amber" style={{width:"100%",justifyContent:"center"}} disabled={loading||!q.trim()} onClick={ask}>
        {loading?"⏳ Reading manual...":"📄 Ask AI About This Manual"}
      </button>
      {result&&<div className="card2" style={{marginTop:"0.75rem",borderColor:"var(--blue-dim)"}}>
        <div style={{fontSize:"0.65rem",color:"var(--blue)",letterSpacing:"0.1em",marginBottom:"0.5rem",fontWeight:700}}>AI MANUAL REFERENCE</div>
        <div style={{fontSize:"0.82rem",color:"var(--text2)",lineHeight:1.75,whiteSpace:"pre-wrap"}}>{result}</div>
      </div>}
    </div>}
  </div>;
}

// ─── Unit Detail ──────────────────────────────────────────────────────────────
function UnitDetail({unit,onEdit,onAddLog,onDeleteLog,isAdmin}){
  const [tab,setTab]=useState("info");
  const score=calcHealth(unit);
  const patterns=analyze(unit);
  const crit=patterns.filter(p=>p.level==="critical").length;
  const warn=patterns.filter(p=>p.level==="warning").length;
  const pc=countParts(unit.logs||[]);
  const critParts=PARTS.filter(p=>pc[p.key]>=3).length;
  const tabs=[
    {id:"info",label:"Info"},
    {id:"logs",label:"History ("+(unit.logs?.length||0)+")"},
    {id:"parts",label:"Parts"+(critParts>0?" 🔴":"")},
    {id:"analysis",label:"Analysis"+(crit>0?" 🔴":warn>0?" 🟡":" ✅")},
    {id:"troubleshoot",label:"AI Troubleshoot"},
    {id:"manuals",label:"Manuals"},
    {id:"report",label:"📊 Report"},
  ];
  const specs=[[" Volts",unit.volts],[" Hz",unit.hz],["RLA",unit.compRLA?unit.compRLA+" A":""],["LRA",unit.lra?unit.lra+" A":""],["Evap Fan",unit.evapFanAmps?unit.evapFanAmps+" A":""],["Refrigerant",unit.refrigerantType],["Charge",unit.totalCharge?unit.totalCharge+" Ozs":""],["High Side",unit.highSidePSI?unit.highSidePSI+" PSI":""],["Low Side",unit.lowSidePSI?unit.lowSidePSI+" PSI":""]].filter(kv=>kv[1]);
  return <div>
    <div style={{display:"flex",gap:"2px",borderBottom:"1px solid var(--border)",overflowX:"auto",marginBottom:"1rem"}}>
      {tabs.map(t=><button key={t.id} className={"tab-btn"+(tab===t.id?" active":"")} onClick={()=>setTab(t.id)}>{t.label}</button>)}
    </div>
    {tab==="info"&&<div className="fade-in">
      <div style={{display:"flex",alignItems:"center",gap:"1rem",marginBottom:"1rem",padding:"0.75rem",background:"var(--surface2)",borderRadius:"var(--radius)"}}>
        <HealthRing score={score} size={56}/>
        <div style={{flex:1}}>
          <StatusBadge status={unit.status}/>
          <div style={{fontSize:"0.72rem",color:"var(--text3)",marginTop:"4px"}}>{unit.pmStatus} PM · Next: {fmtDate(unit.nextPM)}</div>
        </div>
        <button className="btn btn-amber" onClick={onEdit}>Edit Unit</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.5rem 1.5rem",marginBottom:"1rem"}}>
        {[["Serial",unit.serialNumber],["Make / Model",unit.make+(unit.model?" "+unit.model:"")],["Floor",unit.floor],["Suite",unit.zone||"--"],["Room / Cubicle",unit.location||"--"],["Install Date",fmtDate(unit.installDate)],["Last PM",fmtDate(unit.lastPM)]].map(kv=><div key={kv[0]}>
          <div style={{fontSize:"0.62rem",color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:"2px"}}>{kv[0]}</div>
          <div style={{fontSize:"0.85rem",color:"var(--text)",fontWeight:500}}>{kv[1]||"--"}</div>
        </div>)}
      </div>
      {specs.length>0&&<div className="card2" style={{marginBottom:"0.85rem",borderColor:"var(--green-dim)"}}>
        <div style={{fontSize:"0.62rem",color:"var(--green)",letterSpacing:"0.1em",marginBottom:"0.6rem",fontWeight:700}}>⚡ TECHNICAL SPECS</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.4rem 1rem"}}>
          {specs.map(kv=><div key={kv[0]}><div style={{fontSize:"0.6rem",color:"var(--text3)",textTransform:"uppercase"}}>{kv[0].trim()}</div><div style={{color:"var(--green)",fontFamily:"Space Mono,monospace",fontWeight:700,fontSize:"0.82rem"}}>{kv[1]}</div></div>)}
        </div>
      </div>}
      {unit.photoBase64&&<div style={{marginBottom:"0.85rem"}}><div style={{fontSize:"0.62rem",color:"var(--text3)",marginBottom:"0.35rem"}}>UNIT PHOTO</div><img src={"data:image/jpeg;base64,"+unit.photoBase64} style={{width:"100%",maxHeight:"200px",objectFit:"contain",borderRadius:"var(--radius)",border:"1px solid var(--border)",background:"var(--surface2)"}}/></div>}
      {unit.diagramBase64&&<div style={{marginBottom:"0.85rem"}}><div style={{fontSize:"0.62rem",color:"var(--green)",marginBottom:"0.35rem"}}>WIRING DIAGRAM</div><img src={"data:image/jpeg;base64,"+unit.diagramBase64} style={{width:"100%",maxHeight:"200px",objectFit:"contain",borderRadius:"var(--radius)",border:"1px solid var(--green-dim)",background:"var(--surface2)"}}/></div>}
      {unit.notes&&<div className="card2"><div style={{fontSize:"0.62rem",color:"var(--text3)",marginBottom:"0.35rem"}}>NOTES</div><div style={{fontSize:"0.82rem",color:"var(--text2)",lineHeight:1.6}}>{unit.notes}</div></div>}
    </div>}
    {tab==="logs"&&<LogsTab unit={unit} onAddLog={onAddLog} onDeleteLog={onDeleteLog} isAdmin={isAdmin}/>}
    {tab==="parts"&&<PartsTab unit={unit}/>}
    {tab==="analysis"&&<AnalysisTab unit={unit}/>}
    {tab==="troubleshoot"&&<TroubleshootTab unit={unit}/>}
    {tab==="manuals"&&<ManualsTab unit={unit}/>}
    {tab==="report"&&<ReportCard unit={unit}/>}
  </div>;
}

// ─── Unit Form ────────────────────────────────────────────────────────────────
function UnitForm({unit,onSave,onClose}){
  const blank={serialNumber:"",make:"",model:"",location:"",floor:"North Lobby",zone:"",status:"Operational",pmStatus:"Current",lastPM:"",nextPM:"",installDate:"",notes:"",photoBase64:"",diagramBase64:"",volts:"",hz:"",compRLA:"",lra:"",evapFanAmps:"",refrigerantType:"",totalCharge:"",highSidePSI:"",lowSidePSI:""};
  const [form,setForm]=useState(unit?{...blank,...unit}:blank);
  const [scanning,setScanning]=useState(false);
  const [scanMsg,setScanMsg]=useState("");
  const [photoPreview,setPhotoPreview]=useState(unit?.photoBase64?"data:image/jpeg;base64,"+unit.photoBase64:"");
  const [diagPreview,setDiagPreview]=useState(unit?.diagramBase64?"data:image/jpeg;base64,"+unit.diagramBase64:"");
  const [savedMakes]=useState(getAllMakes);
  const [savedModels,setSavedModels]=useState(()=>getModels(unit?.make||""));
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  function handleLastPM(v){set("lastPM",v);if(v)set("nextPM",addMonths(v,4))}
  function handleMake(v){set("make",v);setSavedModels(getModels(v))}
  function handlePhoto(e){
    const file=e.target.files[0];if(!file)return;
    setScanning(true);setScanMsg("Processing...");
    compressImage(file,1200).then(b64=>{
      if(!b64){setScanMsg("Could not read image.");setScanning(false);return}
      setPhotoPreview("data:image/jpeg;base64,"+b64);set("photoBase64",b64);
      setScanMsg("Scanning nameplate with AI...");
      fetch("/anthropic",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:"Look at this HVAC unit nameplate. Extract all visible text. Return ONLY valid JSON: {serialNumber,make,model,refrigerantType,voltage,hz,compRLA,lra,tonnage,notes}. Empty string for missing."}]}]})})
      .then(r=>r.json()).then(d=>{
        const text=(d.content||[]).map(b=>b.text||"").join("").trim();
        const s=text.indexOf("{"),en=text.lastIndexOf("}");
        if(s===-1){setScanMsg("AI could not read nameplate — fill in manually.");setScanning(false);return}
        const p=JSON.parse(text.slice(s,en+1));
        setForm(f=>({...f,serialNumber:p.serialNumber||f.serialNumber,make:p.make||f.make,model:p.model||f.model,volts:p.voltage||f.volts,hz:p.hz||f.hz,compRLA:p.compRLA||f.compRLA,lra:p.lra||f.lra,refrigerantType:p.refrigerantType||f.refrigerantType,notes:[f.notes,p.tonnage&&"Tonnage: "+p.tonnage].filter(Boolean).join(" | "),photoBase64:b64}));
        setScanMsg("✅ Nameplate scanned — review fields below.");setScanning(false);
      }).catch(err=>{setScanMsg("Scan failed: "+err.message.slice(0,60));setScanning(false)});
    });
  }
  function handleDiagram(e){
    const file=e.target.files[0];if(!file)return;
    compressImage(file,1600).then(b64=>{if(b64){setDiagPreview("data:image/jpeg;base64,"+b64);set("diagramBase64",b64)}});
  }
  function handleSave(){
    if(!form.serialNumber||!form.make){alert("Serial Number and Make are required.");return}
    saveBrand(form.make,form.model);onSave(form);
  }
  return <div>
    <div className="card2" style={{marginBottom:"1rem",borderColor:"var(--border2)"}}>
      <div style={{fontSize:"0.65rem",color:"var(--text3)",letterSpacing:"0.1em",marginBottom:"0.6rem",fontWeight:600}}>NAMEPLATE PHOTO — AI AUTO-FILL</div>
      <div style={{display:"flex",gap:"0.75rem",alignItems:"flex-start",flexWrap:"wrap"}}>
        {photoPreview&&<img src={photoPreview} style={{width:"84px",height:"84px",objectFit:"cover",borderRadius:"var(--radius)",border:"1px solid var(--border)",flexShrink:0}}/>}
        <div style={{flex:1,minWidth:"160px"}}>
          <label className="btn btn-ghost" style={{cursor:"pointer"}}>
            {photoPreview?"📷 Change Photo":"📷 Upload / Take Photo"}
            <input type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handlePhoto}/>
          </label>
          <div style={{fontSize:"0.68rem",color:"var(--text3)",marginTop:"0.4rem"}}>Point at nameplate — AI reads serial, make, model, specs.</div>
          {scanMsg&&<div style={{fontSize:"0.72rem",marginTop:"0.4rem",color:scanning?"var(--amber)":scanMsg.startsWith("✅")?"var(--green)":"var(--red)"}}>{scanMsg}</div>}
        </div>
      </div>
    </div>
    <div className="card2" style={{marginBottom:"1rem",borderColor:"var(--green-dim)"}}>
      <div style={{fontSize:"0.65rem",color:"var(--green)",letterSpacing:"0.1em",marginBottom:"0.6rem",fontWeight:600}}>WIRING DIAGRAM — FOR AI TROUBLESHOOTING</div>
      <div style={{display:"flex",gap:"0.75rem",alignItems:"flex-start",flexWrap:"wrap"}}>
        {diagPreview&&<img src={diagPreview} style={{width:"84px",height:"84px",objectFit:"cover",borderRadius:"var(--radius)",border:"1px solid var(--green-dim)",flexShrink:0}}/>}
        <div style={{flex:1,minWidth:"160px"}}>
          <label className="btn btn-ghost" style={{cursor:"pointer",borderColor:"var(--green-dim)",color:"var(--green)"}}>
            {diagPreview?"📐 Change Diagram":"📐 Upload Diagram"}
            <input type="file" accept="image/*" style={{display:"none"}} onChange={handleDiagram}/>
          </label>
          {diagPreview&&<div style={{fontSize:"0.7rem",color:"var(--green)",marginTop:"0.4rem"}}>✅ Diagram saved</div>}
        </div>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 1rem"}}>
      <Field label="Serial Number *"><input className="inp" value={form.serialNumber} onChange={e=>set("serialNumber",e.target.value)} placeholder="e.g. AC-2024-001"/></Field>
      <Field label="Make / Brand *">
        <input className="inp" list="makes-list" value={form.make} onChange={e=>handleMake(e.target.value)} placeholder="e.g. Carrier, Trane"/>
        <datalist id="makes-list">{savedMakes.map(m=><option key={m} value={m}/>)}</datalist>
      </Field>
      <Field label="Model">
        <input className="inp" list="models-list" value={form.model} onChange={e=>set("model",e.target.value)} placeholder="e.g. 50XC060"/>
        <datalist id="models-list">{savedModels.map(m=><option key={m} value={m}/>)}</datalist>
      </Field>
      <Field label="Floor"><select className="inp" value={form.floor} onChange={e=>{set("floor",e.target.value);set("zone","")}}>{FLOORS.map(f=><option key={f}>{f}</option>)}</select></Field>
      {getZones(form.floor).length>0&&<Field label="Suite"><select className="inp" value={form.zone||""} onChange={e=>set("zone",e.target.value)}><option value="">-- Select --</option>{getZones(form.floor).map(z=><option key={z} value={z}>{z}</option>)}</select></Field>}
      <Field label="Room / Cubicle"><input className="inp" value={form.location} onChange={e=>set("location",e.target.value)} placeholder="e.g. Room 204, Cubicle B3"/></Field>
      <Field label="Unit Status"><select className="inp" value={form.status} onChange={e=>set("status",e.target.value)}>{UNIT_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
      <Field label="Install Date"><input type="date" className="inp" value={form.installDate} onChange={e=>set("installDate",e.target.value)}/></Field>
      <Field label="Last PM"><input type="date" className="inp" value={form.lastPM} onChange={e=>handleLastPM(e.target.value)}/></Field>
      <Field label="Next PM (auto-set)"><input type="date" className="inp" style={{color:form.nextPM?"var(--green)":"var(--text3)"}} value={form.nextPM} onChange={e=>set("nextPM",e.target.value)}/></Field>
      <Field label="PM Status"><select className="inp" value={form.pmStatus} onChange={e=>set("pmStatus",e.target.value)}>{PM_LIST.map(s=><option key={s}>{s}</option>)}</select></Field>
    </div>
    <div style={{borderTop:"1px solid var(--border)",marginTop:"0.5rem",paddingTop:"1rem",marginBottom:"0.5rem"}}>
      <div style={{fontSize:"0.65rem",color:"var(--amber)",letterSpacing:"0.12em",marginBottom:"0.75rem",fontWeight:700}}>TECHNICAL SPECIFICATIONS</div>

          {form.tech.length===2&&<div style={{width:"36px",height:"36px",borderRadius:"50%",background:"var(--amber)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.78rem",fontWeight:700,color:"#000",flexShrink:0}}>{form.tech}</div>}
        </div>
      </Field>
      {isRef&&<Field label="Refrigerant Added (lbs)"><input className="inp" type="number" step="0.1" value={form.refrigerantAdded} onChange={e=>set("refrigerantAdded",e.target.value)} placeholder="e.g. 2.5"/></Field>}
      {isRef&&<Field label="System Pressure (PSI)"><input className="inp" type="number" value={form.pressure} onChange={e=>set("pressure",e.target.value)} placeholder="e.g. 150"/></Field>}
    </div>
    <Field label="Description *"><textarea className="inp" value={form.description} onChange={e=>set("description",e.target.value)} placeholder="Describe work done, parts replaced, issues found..."/></Field>
    {form.type==="PM"&&<div className="alert alert-good" style={{marginBottom:"0.75rem",fontSize:"0.78rem"}}>PM logged = next PM auto-scheduled in 4 months.</div>}
    <div style={{display:"flex",gap:"0.75rem",justifyContent:"flex-end"}}>
      <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
      <button className="btn" style={{background:btnColor[form.type]||"var(--blue)",color:"#000"}} onClick={()=>{if(form.description)onSave(form)}}>Save Log</button>
    </div>

function UnitRow({unit, selected, onSelect}){
  const score=calcHealth(unit);
  const color=score>=75?"var(--green)":score>=50?"var(--amber)":score>=25?"var(--orange)":"var(--red)";
  const alerts=analyze(unit);
  const hasCrit=alerts.some(function(a){return a.level==="critical"});
  const hasWarn=alerts.some(function(a){return a.level==="warning"});
  const borderColor=hasCrit?"var(--red)":hasWarn?"var(--amber)":SC[unit.status]||"var(--border)";
  return <div className={"unit-item"+(selected?" selected":"")} style={{borderLeftColor:borderColor}} onClick={function(){onSelect(unit)}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:"0.4rem",marginBottom:"2px"}}>
          <span style={{fontFamily:"Space Mono,monospace",fontWeight:700,color:"var(--amber)",fontSize:"0.85rem"}}>{unit.serialNumber}</span>
          <span style={{fontSize:"0.65rem",fontWeight:700,color:color,background:color+"22",padding:"1px 5px",borderRadius:"99px"}}>{score}</span>
          {hasCrit&&<span>🔴</span>}
          {!hasCrit&&hasWarn&&<span>🟡</span>}
        </div>
        <div style={{fontSize:"0.78rem",color:"var(--text2)"}}>{unit.make}{unit.model?" · "+unit.model:""}</div>
        <div style={{fontSize:"0.68rem",color:"var(--text3)",marginTop:"2px"}}>{unit.floor}{unit.zone?" › "+unit.zone:""}{unit.location?" — "+unit.location:""}</div>
      </div>
      <div style={{textAlign:"right",flexShrink:0,marginLeft:"0.5rem"}}>
        <StatusBadge status={unit.status}/>
        <div style={{fontSize:"0.62rem",color:"var(--text3)",marginTop:"4px"}}>{unit.logs?unit.logs.length:0} logs</div>
        {unit.nextPM&&<div style={{fontSize:"0.6rem",color:"var(--text3)",marginTop:"2px"}}>PM {fmtDate(unit.nextPM)}</div>}
      </div>
    </div>
  </div>;
}

function FloorGroupedList({units, selectedUnit, onSelect}){
  if(!units||units.length===0) return <div style={{padding:"3rem",textAlign:"center",color:"var(--text3)"}}>
    <div style={{fontSize:"2.5rem",marginBottom:"0.75rem"}}>⚙️</div>
    <div style={{fontWeight:600}}>No units found</div>
  </div>;

  const grouped={};
  FLOORS.forEach(function(f){grouped[f]=[]});
  units.forEach(function(u){
    if(grouped[u.floor]) grouped[u.floor].push(u);
    else grouped["Other"].push(u);
  });

  return <div>{FLOORS.filter(function(f){return grouped[f]&&grouped[f].length>0}).map(function(floor){
    return <div key={floor}>
      <div style={{padding:"0.45rem 1rem",background:"var(--surface2)",borderBottom:"1px solid var(--border)",borderTop:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:1}}>
        <span style={{fontSize:"0.68rem",fontWeight:700,color:"var(--amber)",letterSpacing:"0.08em",fontFamily:"Space Mono,monospace"}}>{floor.toUpperCase()}</span>
        <span style={{fontSize:"0.62rem",color:"var(--text3)",background:"var(--surface3)",padding:"1px 8px",borderRadius:"99px"}}>{grouped[floor].length}</span>
      </div>
      {grouped[floor].map(function(unit){
        return <UnitRow key={unit.id} unit={unit} selected={selectedUnit&&selectedUnit.id===unit.id} onSelect={onSelect}/>;
      })}
    </div>;
  })}</div>;
}

function App(){
  const [session,setSession]=useState(getSession);
  const [user,setUser]=useState(null);
  const [units,setUnits]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [dbError,setDbError]=useState("");
  const [search,setSearch]=useState("");
  const [filterFloor,setFilterFloor]=useState("All");
  const [filterStatus,setFilterStatus]=useState("All");
  const [modal,setModal]=useState(null);
  const [selectedUnit,setSelectedUnit]=useState(null);
  const [addingLog,setAddingLog]=useState(false);
  const [view,setView]=useState("home");
  const [quickFilter,setQuickFilter]=useState("");

  const token=session?.access_token||"";
  const isAdmin=user?.user_metadata?.role==="admin";
  const userName=user?.user_metadata?.name||user?.email||"";

  useEffect(()=>{
    if(token)authGetUser(token).then(u=>{if(u)setUser(u);else{clearSess();setSession(null)}});
    else setLoading(false);
  },[token]);

  const loadUnits=useCallback(()=>{
    if(!token)return;
    setLoading(true);setDbError("");
    dbGet(token).then(data=>{setUnits(data);setSelectedUnit(sel=>sel?data.find(u=>u.id===sel.id)||null:null)}).catch(e=>setDbError(e.message)).finally(()=>setLoading(false));
  },[token]);

  useEffect(()=>{if(session)loadUnits();else setLoading(false)},[loadUnits,session]);

  if(!session)return <AuthScreen onLogin={s=>{saveSession(s);setSession(s)}}/>;

  function saveUnit(form){
    setSaving(true);
    if(modal?.unit){
      const updated={...modal.unit,...form};
      dbUpdate(token,updated).then(()=>{setUnits(us=>us.map(u=>u.id===updated.id?updated:u));setSelectedUnit(updated);setModal(null)}).catch(e=>alert("Save failed: "+e.message)).finally(()=>setSaving(false));
    }else{
      const n={...form,id:Date.now().toString(),logs:[],createdAt:new Date().toISOString()};
      dbSave(token,n).then(()=>{setUnits(us=>[...us,n]);setModal(null)}).catch(e=>alert("Save failed: "+e.message)).finally(()=>setSaving(false));
    }
  }
  function deleteUnit(id){
    if(!confirm("Delete this unit and all history?"))return;
    dbDelete(token,id).then(()=>{setUnits(us=>us.filter(u=>u.id!==id));setSelectedUnit(null)}).catch(e=>alert("Delete failed: "+e.message));
  }
  function saveLog(log){
    const entry={...log,id:Date.now().toString()};
    const unit=units.find(u=>u.id===selectedUnit.id);
    const logs=[...unit.logs||[],entry];
    let updated={...unit,logs};
    if(log.type==="PM"&&log.date){updated.lastPM=log.date;updated.nextPM=addMonths(log.date,4);updated.pmStatus="Current"}
    dbUpdate(token,updated).then(()=>{setUnits(us=>us.map(u=>u.id===updated.id?updated:u));setSelectedUnit(updated)}).catch(e=>alert("Save failed: "+e.message));
    setAddingLog(false);
  }
  function deleteLog(idx){
    const unit=units.find(u=>u.id===selectedUnit.id);
    const updated={...unit,logs:unit.logs.filter((_,i)=>i!==idx)};
    dbUpdate(token,updated).then(()=>{setUnits(us=>us.map(u=>u.id===updated.id?updated:u));setSelectedUnit(updated)}).catch(e=>alert("Delete failed: "+e.message));
  }

  const filtered=units.filter(u=>{
    const q=search.toLowerCase();
    const statusMatch=quickFilter?u.status===quickFilter:(filterStatus==="All"||u.status===filterStatus);
    return(!q||[u.serialNumber,u.make,u.model,u.location,u.floor,u.zone].some(v=>v&&v.toLowerCase().includes(q)))&&(filterFloor==="All"||u.floor===filterFloor)&&statusMatch;
  });
  const criticalUnits=units.filter(u=>analyze(u).some(a=>a.level==="critical")).length;

  return <div style={{display:"flex",height:"100vh",overflow:"hidden"}}>
    <div style={{width:"220px",background:"var(--surface)",borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",flexShrink:0}} className="no-print">
      <div style={{padding:"1.25rem 1rem",borderBottom:"1px solid var(--border)"}}>
        <div style={{fontFamily:"Space Mono,monospace",fontSize:"1.1rem",fontWeight:700,color:"var(--amber)",letterSpacing:"0.15em"}}>HVACT</div>
        <div style={{fontSize:"0.62rem",color:"var(--text3)",marginTop:"2px",letterSpacing:"0.06em"}}>MAINTENANCE SYSTEM</div>
      </div>
      <div style={{padding:"0.75rem",flex:1}}>
        {[{id:"home",icon:"🏠",label:"Home"},{id:"units",icon:"⚙️",label:"Units",badge:criticalUnits>0?criticalUnits:null},{id:"dashboard",icon:"📊",label:"Dashboard"},{id:"tools",icon:"🔧",label:"Field Tools"}].map(item=><button key={item.id} className={"nav-item"+(view===item.id?" active":"")} onClick={()=>{setView(item.id);if(item.id!=="units")setSelectedUnit(null);if(item.id==="units")setFilterStatus("All")}}>
          <span>{item.icon}</span><span style={{flex:1}}>{item.label}</span>
          {item.badge&&<span style={{background:"var(--red)",color:"#fff",fontSize:"0.6rem",fontWeight:700,padding:"1px 6px",borderRadius:"99px"}}>{item.badge}</span>}
        </button>)}
      </div>
      <div style={{padding:"0.75rem",borderTop:"1px solid var(--border)"}}>
        <div style={{display:"flex",alignItems:"center",gap:"0.5rem",marginBottom:"0.5rem"}}>
          <div style={{width:"28px",height:"28px",borderRadius:"50%",background:"var(--amber-dim)",border:"1px solid var(--amber)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.7rem",fontWeight:700,color:"var(--amber)",flexShrink:0}}>{(userName[0]||"?").toUpperCase()}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:"0.72rem",fontWeight:600,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{userName}</div>
            <div style={{fontSize:"0.6rem",color:isAdmin?"var(--amber)":"var(--green)"}}>{isAdmin?"Admin":"Technician"}</div>
          </div>
        </div>
        <button className="nav-item" onClick={()=>{authSignOut(token);clearSess();setSession(null);setUser(null);setUnits([])}}>
          <span>🚪</span><span>Log Out</span>
        </button>
      </div>
    </div>
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{background:"var(--surface)",borderBottom:"1px solid var(--border)",padding:"0.75rem 1.25rem",display:"flex",alignItems:"center",gap:"0.75rem",flexShrink:0}} className="no-print">
        {view==="units"&&<>
          <input className="inp" style={{width:"220px"}} placeholder="Search serial, make, floor..." value={search} onChange={e=>setSearch(e.target.value)}/>
          {quickFilter&&<span style={{display:"flex",alignItems:"center",gap:"0.35rem",background:"var(--amber-dim)",border:"1px solid var(--amber)",borderRadius:"99px",padding:"0.2rem 0.65rem",fontSize:"0.72rem",color:"var(--amber)",fontWeight:600}}>{quickFilter} <button onClick={()=>setQuickFilter("")} style={{background:"none",border:"none",color:"var(--amber)",cursor:"pointer",fontSize:"0.8rem",padding:0,lineHeight:1}}>✕</button></span>}
          <select className="inp" style={{width:"130px"}} value={filterFloor} onChange={e=>setFilterFloor(e.target.value)}><option value="All">All Floors</option>{FLOORS.map(f=><option key={f}>{f}</option>)}</select>
          <select className="inp" style={{width:"150px"}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}><option value="All">All Statuses</option>{UNIT_STATUS.map(s=><option key={s}>{s}</option>)}</select>
          <span style={{fontSize:"0.72rem",color:"var(--text3)",marginLeft:"auto"}}>{filtered.length} / {units.length} units</span>
        </>}
        {view!=="units"&&<span style={{fontWeight:600}}>{view==="dashboard"?"Building Dashboard":"Field Tools"}</span>}
        <div style={{display:"flex",gap:"0.5rem",marginLeft:view==="units"?"0":"auto"}}>
          {view==="units"&&<button className="btn btn-ghost" style={{padding:"0.4rem 0.7rem"}} onClick={loadUnits}>↻</button>}
          {view==="units"&&<button className="btn btn-amber" onClick={()=>setModal({type:"add"})}>+ Add Unit</button>}
          {(loading||saving)&&<span style={{fontSize:"0.72rem",color:saving?"var(--green)":"var(--amber)",padding:"0.4rem 0"}}>{saving?"Saving...":"Loading..."}</span>}
        </div>
        {dbError&&<span style={{fontSize:"0.68rem",color:"var(--red)"}}>{dbError} <button onClick={loadUnits} style={{background:"none",border:"none",color:"var(--amber)",cursor:"pointer",fontSize:"0.68rem"}}>Retry</button></span>}
      </div>
      <div style={{flex:1,overflow:"hidden",display:"flex"}}>
        {view==="home"&&<div style={{flex:1,overflowY:"auto"}}><HomeScreen user={user} units={units} isAdmin={isAdmin} onNavigate={(v,status)=>{setView(v);setQuickFilter(status||"");if(v!=="units")setSelectedUnit(null)}}/></div>}
        {view==="dashboard"&&<div style={{flex:1,overflowY:"auto",padding:"1.25rem"}}><Dashboard units={units}/></div>}
        {view==="tools"&&<div style={{flex:1,overflowY:"auto",padding:"1.25rem"}}>
          <div style={{maxWidth:"700px",margin:"0 auto"}}>
            {[{id:"pt",label:"PT Chart",Component:PTChartTool},{id:"calc",label:"Calculators",Component:CalculatorTools}].map(({id,label,Component})=><div key={id} className="card" style={{marginBottom:"1rem"}}><details><summary style={{cursor:"pointer",fontWeight:600,fontSize:"0.9rem",padding:"0.25rem 0",listStyle:"none"}}>{label}</summary><div style={{marginTop:"1rem"}}><Component/></div></details></div>)}
          </div>
        </div>}
        {view==="units"&&<>
          <div style={{width:selectedUnit?"320px":"100%",borderRight:selectedUnit?"1px solid var(--border)":"none",overflowY:"auto",flexShrink:0}}>
            {!loading&&filtered.length===0&&<div style={{padding:"3rem",textAlign:"center",color:"var(--text3)"}}>
              <div style={{fontSize:"2.5rem",marginBottom:"0.75rem"}}>⚙️</div>
              <div style={{fontWeight:600,marginBottom:"0.25rem"}}>{units.length===0?"No units yet":"No results"}</div>
              <div style={{fontSize:"0.82rem"}}>{units.length===0?"Click + Add Unit to get started":"Try adjusting your search or filters"}</div>
            </div>}
            {!loading&&<FloorGroupedList units={filtered} selectedUnit={selectedUnit} onSelect={setSelectedUnit}/>}
          </div>
          {selectedUnit&&<div style={{flex:1,overflowY:"auto",padding:"1.25rem",minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"1rem"}} className="no-print">
              <div>
                <div style={{fontFamily:"Space Mono,monospace",fontSize:"1.1rem",fontWeight:700,color:"var(--amber)"}}>{selectedUnit.serialNumber}</div>
                <div style={{fontSize:"0.78rem",color:"var(--text3)"}}>{selectedUnit.make} {selectedUnit.model} — {selectedUnit.floor}{selectedUnit.zone?" › "+selectedUnit.zone:""}</div>
              </div>
              <div style={{display:"flex",gap:"0.4rem"}}>
                {isAdmin&&<button className="btn btn-red" onClick={()=>deleteUnit(selectedUnit.id)}>Delete</button>}
                <button className="btn btn-ghost" onClick={()=>setSelectedUnit(null)}>✕ Close</button>
              </div>
            </div>
            <UnitDetail unit={selectedUnit} onEdit={()=>setModal({type:"edit",unit:selectedUnit})} onAddLog={()=>setAddingLog(true)} onDeleteLog={deleteLog} isAdmin={isAdmin}/>
          </div>}
        </>}
      </div>
    </div>
    {modal?.type==="add"&&<Modal title="Register New Unit" onClose={()=>setModal(null)}><UnitForm onSave={saveUnit} onClose={()=>setModal(null)}/></Modal>}
    {modal?.type==="edit"&&<Modal title={"Edit — "+modal.unit.serialNumber} onClose={()=>setModal(null)}><UnitForm unit={modal.unit} onSave={saveUnit} onClose={()=>setModal(null)}/></Modal>}
    {addingLog&&selectedUnit&&<Modal title={"Log — "+selectedUnit.serialNumber} onClose={()=>setAddingLog(false)}><LogForm onSave={saveLog} onClose={()=>setAddingLog(false)}/></Modal>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
