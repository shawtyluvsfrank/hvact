async function dbGetUnits() {
  const r = await fetch(SUPABASE_URL + "/rest/v1/units?order=created_at.asc", { headers: HEADERS });
  if (!r.ok) throw new Error(await r.text());
  const rows = await r.json();

async function dbSaveUnit(unit) {
  const row = { id: unit.id, serial_number: unit.serialNumber, make: unit.make, model: unit.model, floor: unit.floor, location: unit.location, status: unit.status, pm_status: unit.pmStatus, last_pm: unit.lastPM, next_pm: unit.nextPM, install_date: unit.installDate, notes: unit.notes, photo_base64: unit.photoBase64 || null, diagram_base64: unit.diagramBase64 || null, created_at: unit.createdAt, logs: unit.logs || [] };
  const r = await fetch(SUPABASE_URL + "/rest/v1/units", { method: "POST", headers: { ...HEADERS, "Prefer": "resolution=merge-duplicates,return=representation" }, body: JSON.stringify(row) });

async function dbUpdateUnit(unit) {

const STATUS_COLORS = { Operational: "#22c55e", "Needs PM": "#f59e0b", "Under Repair": "#ef4444", "Out of Service": "#6b7280" };
const PM_STATUS_COLORS = { Current: "#22c55e", "Due Soon": "#f59e0b", Overdue: "#ef4444" };
const TYPE_COLORS = { PM: "#22c55e", Repair: "#ef4444", Inspection: "#3b82f6", Note: "#a855f7", Emergency: "#f97316", Refrigerant: "#06b6d4" };
const UNIT_STATUS = ["Operational", "Needs PM", "Under Repair", "Out of Service"];
const PM_STATUS = ["Current", "Due Soon", "Overdue"];
const FLOORS = ["North Lobby","South Lobby","3S","4S","5S","5","6S","6","7S","7","8S","8","9","10","11","12","13","14","15","Rooftop","Mechanical Room","Other"];
const LOG_TYPES = ["PM","Repair","Inspection","Refrigerant","Note","Emergency"];

function addMonths(dateStr, n) { const d = new Date(dateStr); d.setMonth(d.getMonth() + n); return d.toISOString().split("T")[0]; }
function formatDate(ds) { if (!ds) return "—"; return new Date(ds).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }); }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

function analyzePatterns(unit) {
  const logs = unit.logs || [], alerts = [];
  const repairs = logs.filter(l => l.type === "Repair");
  const refrigerantLogs = logs.filter(l => l.type === "Refrigerant" || /leak|low pressure|refrigerant|freon|charge/i.test(l.description));
  if (refrigerantLogs.length >= 2) alerts.push({ level:"critical", icon:"🔴", title:"RECURRING REFRIGERANT LEAK DETECTED", detail:`${refrigerantLogs.length} refrigerant/low-pressure events. Repeated recharging indicates an active leak.`, actions:["⛔ Do NOT recharge again — find and fix the leak.","🔧 Pull unit, perform nitrogen pressure test at shop.","📋 Coil/compressor leak → REPLACE UNIT. Fitting leak → repair at shop.","📝 Document all refrigerant additions (EPA Section 608)."] });
  else if (refrigerantLogs.length === 1) alerts.push({ level:"warning", icon:"🟡", title:"LOW PRESSURE / REFRIGERANT EVENT LOGGED", detail:"One refrigerant event recorded. Monitor — a second occurrence indicates a leak.", actions:["✅ Check all fittings for oil (indicates leak point).","🧪 Use electronic leak detector at next PM.","📅 Recurs within 12 months → pull unit for shop repair."] });
  if (repairs.length >= 3) { const sorted = [...repairs].sort((a,b) => new Date(a.date)-new Date(b.date)); const span = daysBetween(sorted[0].date, sorted[sorted.length-1].date); const perYear = span > 0 ? (repairs.length/(span/365)).toFixed(1) : repairs.length; alerts.push({ level: repairs.length >= 5 ? "critical" : "warning", icon: repairs.length >= 5 ? "🔴" : "🟡", title:`HIGH REPAIR FREQUENCY (${repairs.length} repairs, ~${perYear}/yr)`, detail:`Units averaging more than 2 repairs/year are not cost-effective to maintain.`, actions:["💰 Compare cumulative repair costs vs new unit cost.", repairs.length >= 5 ? "🚨 RECOMMEND: Budget for unit replacement." : "⚠️ Flag for supervisor review.","📊 Review logs for root cause."] }); }
  const compressorLogs = logs.filter(l => /compressor/i.test(l.description));
  if (compressorLogs.length >= 2) alerts.push({ level:"critical", icon:"🔴", title:"RECURRING COMPRESSOR ISSUES", detail:`${compressorLogs.length} compressor-related entries. Repairs cost 50-70% of a new unit.`, actions:["🚨 RECOMMEND UNIT REPLACEMENT over compressor repair.","🔌 Check electrical supply — voltage fluctuations cause failures.","🌡️ Verify refrigerant charge — low charge destroys compressors."] });
  const electricalLogs = logs.filter(l => /capacitor|contactor|electrical|fuse|breaker|wiring|relay/i.test(l.description));
  if (electricalLogs.length >= 2) alerts.push({ level:"warning", icon:"🟡", title:"RECURRING ELECTRICAL ISSUES", detail:`${electricalLogs.length} electrical component failures detected.`, actions:["⚡ Check supply voltage — should be within ±10% of nameplate.","🌡️ Inspect panel for heat damage or loose connections.","📅 Replace contactors and capacitors proactively at next PM."] });
  if (unit.nextPM) { const daysOver = daysBetween(unit.nextPM, new Date().toISOString().split("T")[0]); if (daysOver > 30) alerts.push({ level:"warning", icon:"🟡", title:`PM OVERDUE BY ${daysOver} DAYS`, detail:"Deferred PMs dramatically increase failure risk.", actions:["📅 Schedule PM immediately.","🔍 Inspect filters, coils, and electrical components."] }); }
  if (alerts.length === 0 && logs.length >= 2) alerts.push({ level:"good", icon:"✅", title:"NO RECURRING ISSUES DETECTED", detail:`${logs.length} log entries analyzed. Unit appears normal.`, actions:["Continue scheduled PM every 4 months.","Monitor refrigerant pressure at each PM."] });
  return alerts;
}

const inputStyle = { width:"100%", background:"#0d0d0d", border:"1px solid #2e2e2e", borderRadius:"3px", color:"#e5e5e5", padding:"0.5rem 0.6rem", fontSize:"0.82rem", boxSizing:"border-box", outline:"none", fontFamily:"'Courier New',monospace" };
const selectStyle = { ...inputStyle, cursor:"pointer" };
const textareaStyle = { ...inputStyle, resize:"vertical", minHeight:"80px" };

function Modal({ title, onClose, children }) {
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center", padding:"1rem", overflowY:"auto" }}>
      <div style={{ background:"#161616", border:"1px solid #2e2e2e", borderRadius:"4px", width:"100%", maxWidth:"640px", maxHeight:"95vh", overflow:"auto" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"0.9rem 1.25rem", borderBottom:"1px solid #2a2a2a", background:"#111", position:"sticky", top:0, zIndex:1 }}>
          <span style={{ color:"#f59e0b", fontSize:"0.8rem", letterSpacing:"0.12em", textTransform:"uppercase" }}>{title}</span>

function Field({ label, children }) {
  return (
    <div style={{ marginBottom:"0.8rem" }}>
      <label style={{ display:"block", fontSize:"0.62rem", color:"#777", letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:"0.28rem" }}>{label}</label>
      {children}

}

function AlertCard({ alert }) {
  const bg = alert.level==="critical" ? "#1a0505" : alert.level==="warning" ? "#1a1205" : "#051a09";
  const border = alert.level==="critical" ? "#5a1010" : alert.level==="warning" ? "#5a4010" : "#105a20";
  const color = alert.level==="critical" ? "#f87171" : alert.level==="warning" ? "#fbbf24" : "#4ade80";
  return (
    <div style={{ background:bg, border:`1px solid ${border}`, borderRadius:"4px", padding:"0.9rem 1rem", marginBottom:"0.75rem" }}>
      <div style={{ fontSize:"0.78rem", fontWeight:"bold", color, marginBottom:"0.4rem" }}>{alert.icon} {alert.title}</div>
      <div style={{ fontSize:"0.78rem", color:"#bbb", marginBottom:"0.6rem", lineHeight:1.5 }}>{alert.detail}</div>
      <div style={{ borderTop:`1px solid ${border}`, paddingTop:"0.5rem" }}>
        <div style={{ fontSize:"0.65rem", color:"#666", letterSpacing:"0.08em", marginBottom:"0.35rem" }}>RECOMMENDED ACTIONS</div>
        {alert.actions.map((a,i) => <div key={i} style={{ fontSize:"0.76rem", color:"#ccc", padding:"0.2rem 0", lineHeight:1.5 }}>{a}</div>)}
      </div>
    </div>
  );
}

function TroubleshootTab({ unit }) {
  const [symptom, setSymptom] = useState("");
  const [result, setResult] = useState("");
  const [loading, setLoading] = useState(false);
  const [showDiagram, setShowDiagram] = useState(false);

  const run = async () => {
    if (!symptom.trim()) return;
    setLoading(true); setResult("");
    try {
      const unitInfo = `Unit: ${unit.make} ${unit.model}, Serial: ${unit.serialNumber}, Floor: ${unit.floor} ${unit.location||""}, Notes: ${unit.notes||"none"}`;
      const history = (unit.logs||[]).slice(-5).map(l=>`[${l.type}] ${l.date} by ${l.tech||"?"}: ${l.description}`).join("\n") || "No history.";
      const prompt = `You are a senior HVAC technician. Analyze this unit and symptom.\n\nUNIT: ${unitInfo}\n\nHISTORY:\n${history}\n\nSYMPTOM: ${symptom}\n\n${unit.diagramBase64?"A wiring diagram is attached. Reference specific terminals, components, and wiring paths.":"No diagram uploaded."}\n\nProvide:\n1. MOST LIKELY CAUSES (ranked)\n2. STEP-BY-STEP DIAGNOSTIC PROCEDURE\n3. TOOLS NEEDED\n4. PARTS THAT MAY NEED REPLACING\n5. SAFETY WARNINGS\n6. ESTIMATED REPAIR TIME`;
      const content = unit.diagramBase64
        ? [{ type:"image", source:{ type:"base64", media_type:"image/jpeg", data:unit.diagramBase64 } }, { type:"text", text:prompt }]
        : [{ type:"text", text:prompt }];
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "x-api-key":ANTHROPIC_KEY, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
        body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1500, messages:[{ role:"user", content }] })
      });
      if (!resp.ok) throw new Error("API " + resp.status);
      const data = await resp.json();
      setResult((data.content||[]).map(b=>b.text||"").join("").trim());
    } catch(e) { setResult("Error: " + e.message); }
    setLoading(false);
  };

  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:"0.6rem", marginBottom:"0.85rem", padding:"0.6rem 0.85rem", background: unit.diagramBase64?"#050d08":"#0d0a05", border:`1px solid ${unit.diagramBase64?"#1a4a2a":"#3a2a10"}`, borderRadius:"3px" }}>
        <span>{unit.diagramBase64?"📐":"⚠️"}</span>
        <div style={{ flex:1 }}>
          <div style={{ fontSize:"0.72rem", color: unit.diagramBase64?"#4ade80":"#f59e0b", fontWeight:"bold" }}>{unit.diagramBase64?"Wiring diagram loaded — AI will use it for precise troubleshooting":"No diagram — AI uses general knowledge + service history"}</div>
          <div style={{ fontSize:"0.63rem", color:"#555", marginTop:"1px" }}>Edit unit to {unit.diagramBase64?"update":"upload"} a wiring diagram</div>
        </div>
        {unit.diagramBase64 && <img src={"data:image/jpeg;base64,"+unit.diagramBase64} style={{ width:"44px", height:"44px", objectFit:"cover", borderRadius:"2px", cursor:"pointer" }} onClick={()=>setShowDiagram(p=>!p)} />}
      </div>
      {showDiagram && unit.diagramBase64 && <div style={{ marginBottom:"0.85rem" }}><img src={"data:image/jpeg;base64,"+unit.diagramBase64} style={{ width:"100%", borderRadius:"3px", border:"1px solid #1a4a2a" }} /><button onClick={()=>setShowDiagram(false)} style={{ fontSize:"0.65rem", color:"#555", background:"none", border:"none", cursor:"pointer", marginTop:"0.3rem" }}>Hide</button></div>}
      <Field label="Describe the Problem / Symptom">
        <textarea style={{ ...textareaStyle, minHeight:"90px" }} value={symptom} onChange={e=>setSymptom(e.target.value)} placeholder="e.g. Not cooling, compressor loud, tripping breaker, freezing up, leaking water..." />
      </Field>
      <button onClick={run} disabled={loading||!symptom.trim()} style={{ background: loading||!symptom.trim()?"#1a1a1a":"#3b82f6", border:"none", color: loading||!symptom.trim()?"#444":"#fff", padding:"0.55rem 1.25rem", borderRadius:"3px", cursor: loading||!symptom.trim()?"not-allowed":"pointer", fontSize:"0.78rem", fontWeight:"bold", width:"100%", marginBottom:"1rem" }}>
        {loading?"⏳ ANALYZING...":"🔧 RUN AI TROUBLESHOOT"}
      </button>
      {result && <div style={{ background:"#080d12", border:"1px solid #1a2a3a", borderRadius:"4px", padding:"1rem" }}><div style={{ fontSize:"0.62rem", color:"#3b82f6", letterSpacing:"0.1em", marginBottom:"0.75rem" }}>AI TROUBLESHOOTING REPORT — {unit.serialNumber}</div><div style={{ fontSize:"0.8rem", color:"#d0e0f0", lineHeight:1.75, whiteSpace:"pre-wrap" }}>{result}</div></div>}
    </div>
  );
}

function UnitDetail({ unit, onEdit, onAddLog, onDeleteLog }) {
  const [tab, setTab] = useState("info");
  const patterns = analyzePatterns(unit);
  const criticalCount = patterns.filter(p=>p.level==="critical").length;
  const warnCount = patterns.filter(p=>p.level==="warning").length;
  const tabs = [
    { id:"info", label:"INFO" },
    { id:"logs", label:`HISTORY (${unit.logs?.length||0})` },
    { id:"analysis", label:`AI ANALYSIS${criticalCount>0?` 🔴${criticalCount}`:warnCount>0?` 🟡${warnCount}`:" ✅"}` },
    { id:"troubleshoot", label:"🔧 TROUBLESHOOT" }
  ];
  return (
    <div style={{ fontFamily:"'Courier New',monospace" }}>
      <div style={{ display:"flex", gap:"2px", marginBottom:"1rem", borderBottom:"1px solid #222", overflowX:"auto" }}>
        {tabs.map(t => <button key={t.id} onClick={()=>setTab(t.id)} style={{ background:tab===t.id?"#1e1a12":"none", border:"none", borderBottom:tab===t.id?"2px solid #f59e0b":"2px solid transparent", color:tab===t.id?"#f59e0b":"#555", padding:"0.5rem 0.75rem", cursor:"pointer", fontSize:"0.65rem", letterSpacing:"0.06em", whiteSpace:"nowrap" }}>{t.label}</button>)}
      </div>
      {tab==="info" && <>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0.6rem 1.5rem", marginBottom:"1rem" }}>
          {[["Serial #",unit.serialNumber],["Make / Model",`${unit.make}${unit.model?" "+unit.model:""}`],["Floor",unit.floor],["Location",unit.location||"—"],["Status",unit.status],["PM Status",unit.pmStatus],["Install Date",formatDate(unit.installDate)],["Last PM",formatDate(unit.lastPM)],["Next PM",formatDate(unit.nextPM)]].map(([k,v])=>(
            <div key={k}><div style={{ fontSize:"0.6rem", color:"#555", letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:"2px" }}>{k}</div><div style={{ color:k==="Status"?STATUS_COLORS[v]||"#e5e5e5":k==="PM Status"?PM_STATUS_COLORS[v]||"#e5e5e5":"#e5e5e5", fontSize:"0.82rem" }}>{v||"—"}</div></div>
          ))}
        </div>
        {unit.photoBase64 && <div style={{ marginBottom:"0.85rem" }}><div style={{ fontSize:"0.6rem", color:"#555", marginBottom:"0.35rem" }}>UNIT PHOTO</div><img src={"data:image/jpeg;base64,"+unit.photoBase64} style={{ width:"100%", maxHeight:"200px", objectFit:"contain", borderRadius:"3px", border:"1px solid #222", background:"#0a0a0a" }} /></div>}
        {unit.notes && <div style={{ background:"#0d0d0d", border:"1px solid #222", borderRadius:"3px", padding:"0.7rem 0.85rem" }}><div style={{ fontSize:"0.6rem", color:"#555", marginBottom:"0.35rem" }}>NOTES</div><div style={{ color:"#bbb", fontSize:"0.8rem", lineHeight:1.6 }}>{unit.notes}</div></div>}
        <div style={{ marginTop:"1rem", display:"flex", justifyContent:"flex-end" }}><button onClick={onEdit} style={{ background:"#f59e0b", border:"none", color:"#000", padding:"0.45rem 1.1rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.75rem", fontWeight:"bold" }}>EDIT UNIT</button></div>
      </>}
      {tab==="logs" && <>
        <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:"0.75rem" }}><button onClick={onAddLog} style={{ background:"#22c55e", border:"none", color:"#000", padding:"0.4rem 0.9rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.72rem", fontWeight:"bold" }}>+ ADD LOG ENTRY</button></div>
        <div style={{ maxHeight:"360px", overflowY:"auto" }}>
          {(!unit.logs||unit.logs.length===0) ? <div style={{ color:"#444", fontSize:"0.8rem", textAlign:"center", padding:"2.5rem 0" }}>No service history yet</div>
          : [...unit.logs].reverse().map((log,i)=>(
            <div key={i} style={{ borderLeft:`3px solid ${TYPE_COLORS[log.type]||"#444"}`, paddingLeft:"0.75rem", marginBottom:"1rem" }}>
              <div style={{ display:"flex", gap:"0.5rem", alignItems:"center", flexWrap:"wrap", marginBottom:"0.25rem" }}>
                <span style={{ color:TYPE_COLORS[log.type]||"#888", fontSize:"0.68rem", fontWeight:"bold", background:`${TYPE_COLORS[log.type]}22`, padding:"1px 6px", borderRadius:"2px" }}>{log.type}</span>
                <span style={{ color:"#666", fontSize:"0.68rem" }}>{formatDate(log.date)}</span>
                {log.tech && <span style={{ color:"#f59e0b", fontSize:"0.68rem", background:"#1a1200", padding:"1px 5px", borderRadius:"50px", fontWeight:"bold" }}>{log.tech}</span>}
                {log.refrigerantAdded && <span style={{ color:"#06b6d4", fontSize:"0.65rem" }}>💧 {log.refrigerantAdded} lbs</span>}
                {log.pressure && <span style={{ color:"#a855f7", fontSize:"0.65rem" }}>⚡ {log.pressure} PSI</span>}
                <button onClick={()=>onDeleteLog(unit.logs.length-1-i)} style={{ marginLeft:"auto", background:"none", border:"none", color:"#444", cursor:"pointer", fontSize:"0.65rem", padding:0 }}>✕</button>
              </div>
              <div style={{ color:"#ccc", fontSize:"0.8rem", lineHeight:1.55 }}>{log.description}</div>
            </div>
          ))}
        </div>
      </>}
      {tab==="analysis" && <>
        <div style={{ fontSize:"0.68rem", color:"#555", letterSpacing:"0.08em", marginBottom:"0.85rem" }}>PATTERN ANALYSIS — {unit.logs?.length||0} LOG ENTRIES SCANNED</div>
        {(unit.logs?.length||0) < 2 ? <div style={{ color:"#444", fontSize:"0.8rem", padding:"2rem 0", textAlign:"center" }}>Add at least 2 log entries to enable pattern analysis.</div>
        : patterns.map((a,i)=><AlertCard key={i} alert={a} />)}
      </>}
      {tab==="troubleshoot" && <TroubleshootTab unit={unit} />}
    </div>
  );
}

function UnitForm({ unit, onSave, onClose }) {
  const blank = { serialNumber:"", make:"", model:"", location:"", floor:"North Lobby", status:"Operational", pmStatus:"Current", lastPM:"", nextPM:"", installDate:"", notes:"", photoBase64:"", diagramBase64:"" };
  const [form, setForm] = useState(unit ? { ...blank, ...unit } : blank);
  const [scanning, setScanning] = useState(false);
  const [scanMsg, setScanMsg] = useState("");
  const [photoPreview, setPhotoPreview] = useState(unit?.photoBase64 ? "data:image/jpeg;base64,"+unit.photoBase64 : "");
  const set = (k,v) => setForm(f=>({ ...f, [k]:v }));
  const handleLastPM = v => { set("lastPM",v); if(v) set("nextPM",addMonths(v,4)); };

  const handlePhoto = async (e) => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const dataUrl = ev.target.result;
      const base64 = dataUrl.split(",")[1];
      const mediaType = file.type && file.type.startsWith("image/") ? file.type : "image/jpeg";
      setPhotoPreview(dataUrl); set("photoBase64", base64);
      setScanning(true); setScanMsg("Scanning nameplate...");
      try {
        const resp = await fetch("https://api.anthropic.com/v1/messages", {
          method:"POST",
          headers:{ "Content-Type":"application/json", "x-api-key":ANTHROPIC_KEY, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
          body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:800, messages:[{ role:"user", content:[
            { type:"image", source:{ type:"base64", media_type:mediaType, data:base64 } },
            { type:"text", text:"You are an HVAC technician assistant. Examine this AC unit nameplate image carefully. Extract all visible information. Respond with ONLY a raw JSON object, no markdown. Fields: serialNumber, make, model, refrigerantType, voltage, tonnage, notes. Empty string if not visible." }
          ]}] })
        });
        if (!resp.ok) throw new Error("API error " + resp.status);
        const data = await resp.json();
        const text = (data.content||[]).map(b=>b.text||"").join("").trim();
        const match = text.match(/\{[\s\S]*\}/);
        if (!match) throw new Error("No JSON found");
        const parsed = JSON.parse(match[0]);
        const extraNotes = [parsed.refrigerantType&&"Refrigerant: "+parsed.refrigerantType, parsed.voltage&&"Voltage: "+parsed.voltage, parsed.tonnage&&"Tonnage: "+parsed.tonnage, parsed.notes].filter(Boolean).join(" | ");
        setForm(f => ({ ...f, serialNumber:parsed.serialNumber||f.serialNumber, make:parsed.make||f.make, model:parsed.model||f.model, notes:[f.notes,extraNotes].filter(Boolean).join(" | "), photoBase64:base64 }));
        setScanMsg("SUCCESS: Nameplate scanned — review and adjust fields below.");
      } catch(err) { setScanMsg("Could not auto-read nameplate. Fill in manually. (" + err.message.slice(0,50) + ")"); }
      setScanning(false);
    };
    reader.readAsDataURL(file);
  };

  return (
    <>
      <div style={{ marginBottom:"1rem", border:"1px dashed #2e2e2e", borderRadius:"4px", padding:"0.85rem", background:"#0a0a0a" }}>
        <div style={{ fontSize:"0.62rem", color:"#777", letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:"0.6rem" }}>📷 Scan Nameplate / Upload Unit Photo</div>
        <div style={{ display:"flex", gap:"0.75rem", alignItems:"flex-start", flexWrap:"wrap" }}>
          {photoPreview && <img src={photoPreview} style={{ width:"88px", height:"88px", objectFit:"cover", borderRadius:"3px", border:"1px solid #2e2e2e", flexShrink:0 }} />}
          <div style={{ flex:1, minWidth:"160px" }}>
            <label style={{ display:"inline-block", background:"#1a1a1a", border:"1px solid #3a3a3a", color:"#ccc", padding:"0.4rem 0.85rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.73rem", letterSpacing:"0.05em" }}>
              {photoPreview?"CHANGE PHOTO":"📷 UPLOAD / TAKE PHOTO"}
              <input type="file" accept="image/*" capture="environment" style={{ display:"none" }} onChange={handlePhoto} />
            </label>
            <div style={{ fontSize:"0.67rem", color:"#555", marginTop:"0.4rem", lineHeight:1.55 }}>Point camera at the unit nameplate — AI will auto-fill serial #, make, model and specs.</div>
            {scanMsg && <div style={{ fontSize:"0.7rem", marginTop:"0.4rem", color: scanning?"#f59e0b":scanMsg.startsWith("SUCCESS")?"#22c55e":"#f87171" }}>{scanning?"⏳ ":""}{scanMsg}</div>}
          </div>
        </div>
      </div>
      <div style={{ marginBottom:"1rem", border:"1px dashed #1a3a2a", borderRadius:"4px", padding:"0.85rem", background:"#080d0a" }}>
        <div style={{ fontSize:"0.62rem", color:"#4a8a6a", letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:"0.6rem" }}>📐 Upload Wiring / Unit Diagram</div>
        <div style={{ display:"flex", gap:"0.75rem", alignItems:"flex-start", flexWrap:"wrap" }}>
          {form.diagramBase64 && <img src={"data:image/jpeg;base64,"+form.diagramBase64} style={{ width:"88px", height:"88px", objectFit:"cover", borderRadius:"3px", border:"1px solid #1a3a2a", flexShrink:0 }} />}
          <div style={{ flex:1, minWidth:"160px" }}>
            <label style={{ display:"inline-block", background:"#0a1a12", border:"1px solid #1a4a2a", color:"#4ade80", padding:"0.4rem 0.85rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.73rem", letterSpacing:"0.05em" }}>
              {form.diagramBase64?"CHANGE DIAGRAM":"📐 UPLOAD DIAGRAM / WIRING"}
              <input type="file" accept="image/*" style={{ display:"none" }} onChange={e => { const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>set("diagramBase64",ev.target.result.split(",")[1]); r.readAsDataURL(f); }} />
            </label>
            <div style={{ fontSize:"0.67rem", color:"#2a5a3a", marginTop:"0.4rem", lineHeight:1.55 }}>Upload wiring diagram or schematic. AI uses it for accurate troubleshooting.</div>
          </div>
        </div>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 1rem" }}>
        <Field label="Serial Number *"><input style={inputStyle} value={form.serialNumber} onChange={e=>set("serialNumber",e.target.value)} placeholder="e.g. AC-2024-001" /></Field>
        <Field label="Make / Brand *"><input style={inputStyle} value={form.make} onChange={e=>set("make",e.target.value)} placeholder="e.g. Carrier, Trane, York" /></Field>
        <Field label="Model"><input style={inputStyle} value={form.model} onChange={e=>set("model",e.target.value)} placeholder="e.g. 50XC060" /></Field>
        <Field label="Floor / Zone"><select style={selectStyle} value={form.floor} onChange={e=>set("floor",e.target.value)}>{FLOORS.map(f=><option key={f}>{f}</option>)}</select></Field>
        <Field label="Specific Location"><input style={inputStyle} value={form.location} onChange={e=>set("location",e.target.value)} placeholder="e.g. NW Corner, Room 204" /></Field>
        <Field label="Unit Status"><select style={selectStyle} value={form.status} onChange={e=>set("status",e.target.value)}>{UNIT_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
        <Field label="Install Date"><input type="date" style={inputStyle} value={form.installDate} onChange={e=>set("installDate",e.target.value)} /></Field>
        <Field label="Last PM Date"><input type="date" style={inputStyle} value={form.lastPM} onChange={e=>handleLastPM(e.target.value)} /></Field>
        <Field label="Next PM (auto-set)"><input type="date" style={{ ...inputStyle, color:form.nextPM?"#22c55e":"#666" }} value={form.nextPM} onChange={e=>set("nextPM",e.target.value)} /></Field>
        <Field label="PM Status"><select style={selectStyle} value={form.pmStatus} onChange={e=>set("pmStatus",e.target.value)}>{PM_STATUS.map(s=><option key={s}>{s}</option>)}</select></Field>
      </div>
      <Field label="Notes / Comments"><textarea style={textareaStyle} value={form.notes} onChange={e=>set("notes",e.target.value)} placeholder="Known issues, special instructions, technician notes..." /></Field>
      <div style={{ display:"flex", gap:"0.75rem", justifyContent:"flex-end", marginTop:"0.5rem" }}>
        <button onClick={onClose} style={{ background:"none", border:"1px solid #333", color:"#777", padding:"0.5rem 1.1rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.75rem" }}>CANCEL</button>
        <button onClick={()=>{ if(!form.serialNumber||!form.make){ alert("Please fill in Serial Number and Make."); return; } onSave(form); }} style={{ background:"#f59e0b", border:"none", color:"#000", padding:"0.5rem 1.25rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.78rem", fontWeight:"bold" }}>{unit?"UPDATE UNIT":"REGISTER UNIT"}</button>
      </div>
    </>
  );
}

function LogForm({ onSave, onClose }) {
  const [form, setForm] = useState({ type:"PM", date:new Date().toISOString().split("T")[0], tech:"", description:"", refrigerantAdded:"", pressure:"" });
  const set = (k,v) => setForm(f=>({ ...f, [k]:v }));
  const isRefrigerant = form.type==="Refrigerant" || /leak|low pressure|refrigerant|freon/i.test(form.description);
  return (
    <>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 1rem" }}>
        <Field label="Entry Type"><select style={selectStyle} value={form.type} onChange={e=>set("type",e.target.value)}>{LOG_TYPES.map(t=><option key={t}>{t}</option>)}</select></Field>
        <Field label="Date"><input type="date" style={inputStyle} value={form.date} onChange={e=>set("date",e.target.value)} /></Field>
        <Field label="Tech Initials (2 letters)">
          <div style={{ display:"flex", alignItems:"center", gap:"0.5rem" }}>
            <input style={{ ...inputStyle, textTransform:"uppercase", letterSpacing:"0.2em", fontSize:"1rem", fontWeight:"bold", textAlign:"center", width:"72px", flexShrink:0 }} value={form.tech} maxLength={2} onChange={e=>set("tech",e.target.value.toUpperCase().replace(/[^A-Z]/g,""))} placeholder="JD" />
            {form.tech.length===2 && <div style={{ width:"34px", height:"34px", borderRadius:"50%", background:"#f59e0b", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"0.75rem", fontWeight:"bold", color:"#000", flexShrink:0 }}>{form.tech}</div>}
            <span style={{ fontSize:"0.65rem", color:"#555" }}>First 2 letters of your name</span>
          </div>
        </Field>
        {isRefrigerant && <>
          <Field label="Refrigerant Added (lbs)"><input style={inputStyle} type="number" step="0.1" value={form.refrigerantAdded} onChange={e=>set("refrigerantAdded",e.target.value)} placeholder="e.g. 2.5" /></Field>
          <Field label="System Pressure (PSI)"><input style={inputStyle} type="number" value={form.pressure} onChange={e=>set("pressure",e.target.value)} placeholder="e.g. 150" /></Field>
        </>}
      </div>
      <Field label="Description *"><textarea style={textareaStyle} value={form.description} onChange={e=>set("description",e.target.value)} placeholder="Describe work done, parts replaced, issues found..." /></Field>
      {form.type==="PM" && <div style={{ background:"#0a1a0a", border:"1px solid #1a3a1a", borderRadius:"3px", padding:"0.65rem", marginBottom:"0.85rem", fontSize:"0.75rem", color:"#4ade80" }}>✅ Logging a PM will automatically schedule the next PM in 4 months.</div>}
      <div style={{ display:"flex", gap:"0.75rem", justifyContent:"flex-end" }}>
        <button onClick={onClose} style={{ background:"none", border:"1px solid #333", color:"#777", padding:"0.5rem 1.1rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.75rem" }}>CANCEL</button>
        <button onClick={()=>{ if(form.description) onSave(form); }} style={{ background:form.type==="PM"?"#22c55e":form.type==="Emergency"?"#ef4444":"#3b82f6", border:"none", color:"#000", padding:"0.5rem 1.25rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.78rem", fontWeight:"bold" }}>SAVE LOG</button>
      </div>
    </>
  );
}

function App() {
  const [units, setUnits] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [dbError, setDbError] = useState("");
  const [search, setSearch] = useState("");
  const [filterFloor, setFilterFloor] = useState("All");
  const [filterStatus, setFilterStatus] = useState("All");
  const [modal, setModal] = useState(null);
  const [selectedUnit, setSelectedUnit] = useState(null);
  const [addingLog, setAddingLog] = useState(false);

  const loadUnits = useCallback(async () => {
    setLoading(true); setDbError("");
    try { const data = await dbGetUnits(); setUnits(data); setSelectedUnit(sel => sel ? data.find(u=>u.id===sel.id)||null : null); }
    catch(e) { setDbError("Could not connect: " + e.message); }
    setLoading(false);
  }, []);

  useEffect(() => { loadUnits(); }, [loadUnits]);

  const saveUnit = async (form) => {
    setSaving(true);
    const safeForm = { ...form };
    if (safeForm.photoBase64?.length > 500000) safeForm.photoBase64 = "";
    if (safeForm.diagramBase64?.length > 500000) safeForm.diagramBase64 = "";
    try {
      if (modal?.unit) { const updated = { ...modal.unit, ...safeForm }; await dbUpdateUnit(updated); setUnits(us=>us.map(u=>u.id===updated.id?updated:u)); setSelectedUnit(updated); }
      else { const newUnit = { ...safeForm, id:Date.now().toString(), logs:[], createdAt:new Date().toISOString() }; await dbSaveUnit(newUnit); setUnits(us=>[...us,newUnit]); }
      setModal(null);
    } catch(e) { alert("Save failed: " + e.message); }
    setSaving(false);
  };

  const deleteUnit = async (id) => {
    if (!confirm("Delete this unit and all its history?")) return;
    try { await dbDeleteUnit(id); setUnits(us=>us.filter(u=>u.id!==id)); setSelectedUnit(null); }
    catch(e) { alert("Delete failed: " + e.message); }
  };

  const saveLog = async (log) => {
    const entry = { ...log, id:Date.now().toString() };
    const unit = units.find(u=>u.id===selectedUnit.id);
    const logs = [...(unit.logs||[]), entry];
    let updated = { ...unit, logs };
    if (log.type==="PM" && log.date) { updated.lastPM=log.date; updated.nextPM=addMonths(log.date,4); updated.pmStatus="Current"; }
    try { await dbUpdateUnit(updated); setUnits(us=>us.map(u=>u.id===updated.id?updated:u)); setSelectedUnit(updated); }
    catch(e) { alert("Save failed: " + e.message); }
    setAddingLog(false);
  };

  const deleteLog = async (logIdx) => {
    const unit = units.find(u=>u.id===selectedUnit.id);
    const updated = { ...unit, logs:unit.logs.filter((_,i)=>i!==logIdx) };
    try { await dbUpdateUnit(updated); setUnits(us=>us.map(u=>u.id===updated.id?updated:u)); setSelectedUnit(updated); }
    catch(e) { alert("Delete failed: " + e.message); }
  };

  const filtered = units.filter(u => {
    const q = search.toLowerCase();
    return (!q || [u.serialNumber,u.make,u.model,u.location,u.floor].some(v=>v?.toLowerCase().includes(q))) && (filterFloor==="All"||u.floor===filterFloor) && (filterStatus==="All"||u.status===filterStatus);
  });

  const counts = UNIT_STATUS.reduce((acc,s)=>({ ...acc, [s]:units.filter(u=>u.status===s).length }),{});
  const criticalUnits = units.filter(u=>analyzePatterns(u).some(p=>p.level==="critical")).length;

  return (
    <div style={{ minHeight:"100vh", background:"#0a0a0a", color:"#e5e5e5", fontFamily:"'Courier New',monospace" }}>
      {/* Header */}
      <div style={{ background:"#0f0f0f", borderBottom:"2px solid #f59e0b", padding:"0.75rem 1.25rem", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:"0.5rem" }}>
        <div>
          <div style={{ fontSize:"0.95rem", fontWeight:"bold", letterSpacing:"0.18em", color:"#f59e0b" }}>⚙ HVAC TRACKER</div>
          <div style={{ display:"flex", alignItems:"center", gap:"0.5rem", flexWrap:"wrap" }}>
            <div style={{ fontSize:"0.58rem", color:"#555", letterSpacing:"0.1em" }}>HVAC MAINTENANCE MANAGEMENT SYSTEM</div>
            {loading && <span style={{ fontSize:"0.58rem", color:"#f59e0b" }}>⏳ LOADING...</span>}
            {saving && <span style={{ fontSize:"0.58rem", color:"#22c55e" }}>💾 SAVING...</span>}
            {!loading && !saving && <span style={{ fontSize:"0.58rem", color:"#22c55e" }}>☁ CLOUD SYNC ON</span>}
          </div>
          {dbError && <div style={{ fontSize:"0.62rem", color:"#f87171", marginTop:"2px" }}>⚠ {dbError} <button onClick={loadUnits} style={{ background:"none", border:"none", color:"#f59e0b", cursor:"pointer", fontSize:"0.62rem", textDecoration:"underline" }}>Retry</button></div>}
        </div>
        <div style={{ display:"flex", gap:"0.75rem", alignItems:"center", flexWrap:"wrap" }}>
          {criticalUnits > 0 && <div style={{ background:"#2a0a0a", border:"1px solid #5a1010", borderRadius:"3px", padding:"0.25rem 0.6rem", fontSize:"0.65rem", color:"#f87171" }}>🔴 {criticalUnits} NEED ATTENTION</div>}
          {Object.entries(counts).map(([s,c])=><div key={s} style={{ textAlign:"center" }}><div style={{ fontSize:"1rem", fontWeight:"bold", color:STATUS_COLORS[s] }}>{c}</div><div style={{ fontSize:"0.5rem", color:"#555" }}>{s.toUpperCase()}</div></div>)}
          <button onClick={loadUnits} style={{ background:"none", border:"1px solid #333", color:"#666", padding:"0.4rem 0.7rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.7rem" }}>↻</button>
          <button onClick={()=>setModal({ type:"add" })} style={{ background:"#f59e0b", border:"none", color:"#000", padding:"0.45rem 0.9rem", borderRadius:"3px", cursor:"pointer", fontWeight:"bold", fontSize:"0.75rem" }}>+ ADD UNIT</button>
        </div>
      </div>

      {loading && <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:2000, display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column", gap:"1rem" }}><div style={{ fontSize:"2rem" }}>⚙</div><div style={{ color:"#f59e0b", fontSize:"0.85rem", letterSpacing:"0.15em" }}>LOADING FROM CLOUD...</div></div>}

      {/* Filters */}
      <div style={{ background:"#111", borderBottom:"1px solid #1e1e1e", padding:"0.6rem 1.25rem", display:"flex", gap:"0.6rem", flexWrap:"wrap", alignItems:"center" }}>
        <input style={{ ...inputStyle, width:"200px" }} placeholder="🔍 Search serial, make, location..." value={search} onChange={e=>setSearch(e.target.value)} />
        <select style={{ ...selectStyle, width:"140px" }} value={filterFloor} onChange={e=>setFilterFloor(e.target.value)}><option value="All">All Floors</option>{FLOORS.map(f=><option key={f}>{f}</option>)}</select>
        <select style={{ ...selectStyle, width:"140px" }} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}><option value="All">All Statuses</option>{UNIT_STATUS.map(s=><option key={s}>{s}</option>)}</select>
        <span style={{ marginLeft:"auto", fontSize:"0.65rem", color:"#444" }}>{filtered.length} / {units.length} UNITS</span>
      </div>

      {/* Body */}
      <div style={{ display:"flex", height:"calc(100vh - 118px)" }}>
        <div style={{ width:selectedUnit?"340px":"100%", borderRight:selectedUnit?"1px solid #1e1e1e":"none", overflowY:"auto", flexShrink:0 }}>
          {filtered.length===0 ? (
            <div style={{ padding:"3rem", textAlign:"center", color:"#333" }}>
              <div style={{ fontSize:"2rem", marginBottom:"0.5rem" }}>⚙</div>
              <div style={{ fontSize:"0.8rem" }}>{units.length===0?"No units yet — tap + ADD UNIT to start.":"No units match your search."}</div>
            </div>
          ) : filtered.map(unit => {
            const alerts = analyzePatterns(unit);
            const hasCritical = alerts.some(a=>a.level==="critical");
            const hasWarn = alerts.some(a=>a.level==="warning");
            return (
              <div key={unit.id} onClick={()=>setSelectedUnit(unit)} style={{ padding:"0.8rem 1rem", borderBottom:"1px solid #141414", cursor:"pointer", background:selectedUnit?.id===unit.id?"#191409":"transparent", borderLeft:`3px solid ${hasCritical?"#ef4444":hasWarn?"#f59e0b":STATUS_COLORS[unit.status]||"#333"}` }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                  <div>
                    <div style={{ display:"flex", alignItems:"center", gap:"0.4rem" }}>
                      <span style={{ fontSize:"0.82rem", fontWeight:"bold", color:"#f59e0b" }}>{unit.serialNumber}</span>
                      {hasCritical && <span style={{ fontSize:"0.6rem" }}>🔴</span>}
                      {!hasCritical && hasWarn && <span style={{ fontSize:"0.6rem" }}>🟡</span>}
                    </div>
                    <div style={{ fontSize:"0.75rem", color:"#aaa", marginTop:"2px" }}>{unit.make}{unit.model?` · ${unit.model}`:""}</div>
                    <div style={{ fontSize:"0.65rem", color:"#666", marginTop:"2px" }}>📍 {unit.floor}{unit.location?` — ${unit.location}`:""}</div>
                  </div>
                  <div style={{ textAlign:"right", flexShrink:0 }}>
                    <div style={{ fontSize:"0.62rem", color:STATUS_COLORS[unit.status] }}>{unit.status.toUpperCase()}</div>
                    <div style={{ fontSize:"0.58rem", color:"#444", marginTop:"3px" }}>{unit.logs?.length||0} logs</div>
                    {unit.nextPM && <div style={{ fontSize:"0.58rem", color:"#555", marginTop:"2px" }}>PM {formatDate(unit.nextPM)}</div>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {selectedUnit && (
          <div style={{ flex:1, overflowY:"auto", padding:"1rem 1.25rem", minWidth:0 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:"0.85rem" }}>
              <div>
                <div style={{ fontSize:"0.95rem", color:"#f59e0b", fontWeight:"bold", letterSpacing:"0.1em" }}>{selectedUnit.serialNumber}</div>
                <div style={{ fontSize:"0.7rem", color:"#666" }}>{selectedUnit.make} {selectedUnit.model} · {selectedUnit.floor}</div>
              </div>
              <div style={{ display:"flex", gap:"0.4rem" }}>
                <button onClick={()=>deleteUnit(selectedUnit.id)} style={{ background:"none", border:"1px solid #2a0a0a", color:"#ef4444", padding:"0.3rem 0.65rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.65rem" }}>DELETE</button>
                <button onClick={()=>setSelectedUnit(null)} style={{ background:"none", border:"1px solid #2a2a2a", color:"#666", padding:"0.3rem 0.65rem", borderRadius:"3px", cursor:"pointer", fontSize:"0.65rem" }}>CLOSE</button>
              </div>
            </div>
            <UnitDetail unit={selectedUnit} onEdit={()=>setModal({ type:"edit", unit:selectedUnit })} onAddLog={()=>setAddingLog(true)} onDeleteLog={deleteLog} />
          </div>
        )}
      </div>

      {modal?.type==="add" && <Modal title="Register New AC Unit" onClose={()=>setModal(null)}><UnitForm onSave={saveUnit} onClose={()=>setModal(null)} /></Modal>}
      {modal?.type==="edit" && <Modal title={`Edit — ${modal.unit.serialNumber}`} onClose={()=>setModal(null)}><UnitForm unit={modal.unit} onSave={saveUnit} onClose={()=>setModal(null)} /></Modal>}
      {addingLog && selectedUnit && <Modal title={`Service Log — ${selectedUnit.serialNumber}`} onClose={()=>setAddingLog(false)}><LogForm onSave={saveLog} onClose={()=>setAddingLog(false)} /></Modal>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
